<!doctype html>
<!-- Un escritorio de mentira (XFCE + Firefox, 1280×800 como el nodo) para las capturas del banco: capturas.mjs lo
     fotografía en cuatro momentos (?f=1..4) y la hoja los muestra como si fueran la pantalla de su computadora.
     El contenido es inventado (una enciclopedia y un formulario de ejemplo), sin marcas reales. -->
<html lang="es"><head><meta charset="utf-8"><title>escritorio</title>
<style>
  *{box-sizing:border-box} body{margin:0;width:1280px;height:800px;font-family:"DejaVu Sans",Arial,sans-serif;background:#3b4252;overflow:hidden}
  .panel{height:28px;background:#2e3440;color:#d8dee9;font-size:13px;display:flex;align-items:center;gap:18px;padding:0 10px}
  .panel b{color:#88c0d0}.panel .reloj{margin-left:auto}
  .ventana{position:absolute;left:0;top:28px;right:0;bottom:0;background:#f9f9fb;display:flex;flex-direction:column}
  .pestanas{height:38px;background:#e8e8ed;display:flex;align-items:flex-end;padding:0 8px;gap:4px}
  .pestana{background:#f9f9fb;border-radius:8px 8px 0 0;padding:9px 16px;font-size:13px;color:#15141a;min-width:220px}
  .pestana.otra{background:transparent;color:#5b5b66}
  .barra{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #d7d7db}
  .boton{width:28px;height:28px;border-radius:6px;color:#5b5b66;display:flex;align-items:center;justify-content:center;font-size:16px}
  .url{flex:1;height:32px;border-radius:6px;background:#f0f0f4;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#15141a}
  .url span{color:#8f8f9d}
  .pagina{flex:1;overflow:hidden;padding:26px 60px;color:#202122}
  h1{font-family:Georgia,serif;font-weight:400;font-size:34px;border-bottom:1px solid #a2a9b1;margin:0 0 14px;padding-bottom:6px}
  p{font-size:16px;line-height:1.6;margin:0 0 12px;max-width:820px}
  .caja{float:right;width:300px;border:1px solid #a2a9b1;background:#f8f9fa;padding:10px;font-size:14px;margin:0 0 12px 24px}
  .caja div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eaecf0}
  .marca{background:#fff3a3;outline:3px solid #f5a524;border-radius:2px}
  .buscador{margin:120px auto 0;width:640px;text-align:center}
  .buscador .logo{font-family:Georgia,serif;font-size:44px;color:#202122;margin-bottom:24px}
  .campo{height:46px;border:2px solid #36c;border-radius:4px;display:flex;align-items:center;padding:0 14px;font-size:18px;text-align:left}
  .cursor{display:inline-block;width:2px;height:22px;background:#202122;margin-left:2px;vertical-align:middle}
  form{max-width:560px} label{display:block;font-size:14px;color:#54595d;margin:14px 0 4px}
  .entrada{height:38px;border:1px solid #a2a9b1;border-radius:4px;padding:8px 10px;font-size:15px}
  .area{height:110px;border:1px solid #a2a9b1;border-radius:4px;padding:8px 10px;font-size:15px}
  .enviar{margin-top:18px;display:inline-block;background:#36c;color:#fff;padding:10px 26px;border-radius:4px;font-size:16px}
  .puntero{position:absolute;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid #111;transform:rotate(-30deg)}
</style></head>
<body>
<div class="panel"><b>Aplicaciones</b><span>Lugares</span><span>Firefox</span><span class="reloj">10:42</span></div>
<div class="ventana">
  <div class="pestanas"><div class="pestana" id="pestana">Enciclopedia libre</div><div class="pestana otra">Nueva pestaña</div></div>
  <div class="barra"><div class="boton">←</div><div class="boton">→</div><div class="boton">⟳</div><div class="url" id="url"></div><div class="boton">☰</div></div>
  <div class="pagina" id="pagina"></div>
</div>
<div class="puntero" id="puntero"></div>
<script>
  const f = new URLSearchParams(location.search).get('f') || '1';
  const $ = (id) => document.getElementById(id);
  const articulo = (marca) => `
    <h1>Francisco Morazán</h1>
    <div class="caja"><div><span>Nacimiento</span><b class="${marca ? 'marca' : ''}">3 de octubre de 1792</b></div><div><span>Lugar</span><span>Tegucigalpa</span></div><div><span>Fallecimiento</span><span>15 de septiembre de 1842</span></div><div><span>Ocupación</span><span>Político y militar</span></div></div>
    <p><b>José Francisco Morazán Quesada</b> (Tegucigalpa, <span class="${marca ? 'marca' : ''}">3 de octubre de 1792</span> – San José, 15 de septiembre de 1842) fue un político y militar centroamericano que gobernó la República Federal de Centroamérica durante el periodo turbulento de 1830 a 1839.</p>
    <p>Antes de ser presidente de la Federación, fue jefe de Estado de Honduras. Se dio a conocer tras su victoria en la batalla de La Trinidad, el 11 de noviembre de 1827.</p>
    <p>Desde entonces, y hasta su derrota en 1840, dominó la escena política y militar de Centroamérica. Impulsó reformas liberales: educación pública, libertad de prensa y de culto.</p>`;
  const vistas = {
    1: { url: '<span>https://</span>enciclopedia.ejemplo.org', pestana: 'Enciclopedia libre', html: `<div class="buscador"><div class="logo">Enciclopedia libre</div><div class="campo">Francisco Morazán<span class="cursor"></span></div></div>`, p: [690, 286] },
    2: { url: '<span>https://</span>enciclopedia.ejemplo.org/wiki/Francisco_Morazán', pestana: 'Francisco Morazán', html: articulo(false), p: [980, 300] },
    3: { url: '<span>https://</span>enciclopedia.ejemplo.org/wiki/Francisco_Morazán', pestana: 'Francisco Morazán', html: articulo(true), p: [1130, 196] },
    4: { url: '<span>https://</span>formulario.ejemplo.org/contacto', pestana: 'Contacto', html: `<h1>Escríbenos</h1><form><label>Nombre</label><div class="entrada">José</div><label>Correo</label><div class="entrada">jose@ejemplo.org</div><label>Mensaje</label><div class="area">Hola, quisiera saber el horario de atención del sábado.</div><div class="enviar marca">Enviar</div></form>`, p: [150, 520] },
  };
  const v = vistas[f] || vistas[1];
  $('url').innerHTML = v.url; $('pestana').textContent = v.pestana; $('pagina').innerHTML = v.html;
  $('puntero').style.left = v.p[0] + 'px'; $('puntero').style.top = v.p[1] + 'px';
</script>
</body></html>
