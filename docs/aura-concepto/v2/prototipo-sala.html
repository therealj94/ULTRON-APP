<title>AU-RA · La sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #FEF9F3;
    --miel: #E2A83E;
    --miel-osc: #A8701A;
    --salvia: #8FAF93;
    --salvia-osc: #4E6E54;
    --salvia-claro: #E7F0E6;
    --barro: #D9825F;
    --tinta: #3A322C;
    --tinta-2: #6B6056;
    --borde: #EDE0CC;
    --blanco: #FFFFFF;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--tinta);
    font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    padding-inline: 16px;
  }
  .app { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-block: 8px 20px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header img { height: 44px; width: auto; display: block; }
  .quien { display: flex; align-items: center; gap: 8px; color: var(--tinta-2); font-weight: 500; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--salvia); color: var(--blanco);
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
  }
  .escena {
    position: relative; height: clamp(380px, 62vh, 640px); border-radius: 28px; overflow: hidden;
    background: linear-gradient(180deg, #F6ECDF 0%, #EFE1CE 100%); touch-action: manipulation;
  }
  .escena canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .saludo { position: absolute; left: 22px; top: 18px; max-width: 58%; pointer-events: none; }
  .saludo h1 {
    margin: 0; font-family: 'Fredoka', 'Figtree', sans-serif; font-weight: 600;
    font-size: clamp(22px, 3.2vw, 34px); line-height: 1.1; text-wrap: balance;
  }
  .saludo p { margin: 6px 0 0; color: var(--tinta-2); }
  .estado {
    position: absolute; right: 18px; top: 18px; display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, .82); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500;
    color: var(--tinta-2); pointer-events: none;
  }
  .estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--salvia); display: block; }
  .burbuja {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    background: var(--blanco); color: var(--tinta); border-radius: 18px; padding: 10px 14px;
    box-shadow: 0 8px 24px rgba(90, 60, 25, .14); max-width: min(300px, 72%);
    font-size: 15px; line-height: 1.35; pointer-events: none;
  }
  .burbuja::after {
    content: ''; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 14px;
    background: var(--blanco); border-radius: 3px; transform: translateX(-50%) rotate(45deg);
  }
  .panel { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: start; }
  .mic {
    grid-row: span 3; width: 70px; height: 70px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--miel); color: var(--blanco); display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(168, 112, 26, .32); transition: transform .15s;
  }
  .mic:active { transform: scale(.95); }
  .grupo { display: flex; flex-direction: column; gap: 7px; }
  .grupo h2 { margin: 0; font: 600 12px 'Figtree', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--borde); background: var(--blanco); color: var(--tinta);
    border-radius: 999px; padding: 8px 14px; font: 500 14px 'Figtree', system-ui, sans-serif; cursor: pointer;
  }
  .chip svg { flex: 0 0 auto; }
  .chip:hover { border-color: var(--miel); }
  .chip.suave { background: var(--salvia-claro); border-color: var(--salvia-claro); color: var(--salvia-osc); }
  .segmento { display: inline-flex; background: var(--salvia-claro); border-radius: 999px; padding: 3px; }
  .segmento button {
    border: none; background: transparent; color: var(--salvia-osc); border-radius: 999px; padding: 7px 14px;
    font: 500 14px 'Figtree', system-ui, sans-serif; cursor: pointer;
  }
  .segmento button[aria-pressed="true"] { background: var(--blanco); color: var(--tinta); box-shadow: 0 1px 4px rgba(60, 40, 20, .12); }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .nota { margin: 0; font-size: 12px; color: var(--tinta-2); grid-column: 1 / -1; }
  button:focus-visible { outline: 3px solid var(--salvia-osc); outline-offset: 2px; }
  @media (max-width: 720px) {
    .panel { grid-template-columns: 1fr; }
    .mic { grid-row: auto; }
    .saludo { max-width: 70%; }
    .estado { top: auto; bottom: 14px; right: 14px; }
    .quien span { display: none; }
    header img { height: 36px; }
  }
</style>

        <button class="chip" data-accion="oro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8701A" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/></svg>Mostrar el oro</button>
        <button class="chip" data-accion="leer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8701A" stroke-width="2" stroke-linecap="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Leer documento</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  const cont = document.getElementById('escena');
  const burbuja = document.getElementById('burbuja');
  const estadoTxt = document.getElementById('estado');
  const reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const hora = new Date().getHours();
  const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('saludo').textContent = `${saludo}, José`;

  /* ---------- motor ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  cont.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
  const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const std = (hex, rough = 0.8, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: col(hex), roughness: rough, metalness: 0 }, extra));
  const basica = (hex, extra = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: col(hex) }, extra));
  const sombra = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
  const en = (m, x, y, z) => { m.position.set(x, y, z); return m; };

  scene.add(new THREE.HemisphereLight(col('#FFFFFF'), col('#CDB89C'), 0.8));
  const sol = new THREE.DirectionalLight(col('#FFF0DC'), 0.95);
  sol.position.set(-3.2, 5.5, 3.2);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  Object.assign(sol.shadow.camera, { left: -5, right: 5, top: 5, bottom: -3 });
  sol.shadow.radius = 4;
  scene.add(sol);

  function lienzo(w, hh, dibujar) {
    const c = document.createElement('canvas');
    c.width = w; c.height = hh;
    const g = c.getContext('2d');
    dibujar(g, w, hh);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.userData = { c, g };
    return t;
  }
  function redondo(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  /* ---------- la sala ---------- */
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), std('#E2CFB6', 0.95));
  piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true;
  scene.add(piso);
  const pared = new THREE.Mesh(new THREE.PlaneGeometry(24, 9), std('#F4E9DC', 1));
  pared.position.set(0, 4.5, -2.6);
  scene.add(pared);
  const zocalo = new THREE.Mesh(new THREE.BoxGeometry(24, 0.18, 0.06), std('#EBDCC8', 0.9));
  zocalo.position.set(0, 0.09, -2.56);
  scene.add(zocalo);

  const VENTANA = new THREE.Vector3(-0.55, 2.3, -2.58);
  const ventana = new THREE.Mesh(
    new THREE.PlaneGeometry(1.7, 2.34),
    new THREE.MeshBasicMaterial({
      transparent: true,
      map: lienzo(512, 704, (g, w, hh) => {
        const arco = () => { g.beginPath(); g.moveTo(40, hh - 20); g.lineTo(40, w / 2); g.arc(w / 2, w / 2, w / 2 - 40, Math.PI, 0); g.lineTo(w - 40, hh - 20); g.closePath(); };
        g.save(); arco(); g.clip();
        const cielo = g.createLinearGradient(0, 0, 0, hh);
        cielo.addColorStop(0, '#FFE1B0'); cielo.addColorStop(0.6, '#FFF1DA'); cielo.addColorStop(1, '#FBE7CC');
        g.fillStyle = cielo; g.fillRect(0, 0, w, hh);
        const brillo = g.createRadialGradient(w * 0.35, hh * 0.45, 10, w * 0.35, hh * 0.45, 190);
        brillo.addColorStop(0, 'rgba(255,208,130,0.95)'); brillo.addColorStop(1, 'rgba(255,208,130,0)');
        g.fillStyle = brillo; g.fillRect(0, 0, w, hh);
        g.fillStyle = '#B9C79C';
        for (let i = 0; i < 7; i++) { g.beginPath(); g.arc(60 + i * 70, hh * 0.78, 55 + (i % 3) * 14, 0, Math.PI * 2); g.fill(); }
        g.restore();
        g.lineWidth = 22; g.strokeStyle = '#FFFDF8'; arco(); g.stroke();
      }),
    })
  );
  ventana.position.copy(VENTANA);
  scene.add(ventana);

  const luzPiso = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2, 3.2),
    new THREE.MeshBasicMaterial({
      transparent: true, depthWrite: false,
      map: lienzo(256, 256, (g, w, hh) => {
        const r = g.createRadialGradient(w / 2, hh / 2, 5, w / 2, hh / 2, w / 2);
        r.addColorStop(0, 'rgba(255,240,214,0.55)'); r.addColorStop(1, 'rgba(255,240,214,0)');
        g.fillStyle = r; g.fillRect(0, 0, w, hh);
      }),
    })
  );
  luzPiso.rotation.x = -Math.PI / 2; luzPiso.rotation.z = 0.5;
  luzPiso.position.set(0, 0.004, -0.6);
  scene.add(luzPiso);

  const alfombra = new THREE.Mesh(new THREE.CircleGeometry(1.6, 64), std('#E9DFD0', 1));
  alfombra.rotation.x = -Math.PI / 2; alfombra.position.set(0.2, 0.006, 0.5); alfombra.receiveShadow = true;
  scene.add(alfombra);

  // nicho con jarrón
  const nicho = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.9), std('#EADCC9', 1));
  nicho.position.set(1.1, 2.55, -2.585);
  scene.add(nicho);
  const jarron = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 14), std('#E8D8C2', 0.6)));
  jarron.scale.set(1, 1.35, 1); jarron.position.set(1.1, 2.3, -2.5);
  scene.add(jarron);

  // planta
  const planta = new THREE.Group();
  planta.add(sombra(en(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.23, 0.55, 32), std('#D9825F', 0.85)), 0, 0.275, 0)));
  const tonosHoja = ['#7FA384', '#8FAF93', '#6C9272'];
  for (let i = 0; i < 9; i++) {
    const hoja = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), std(tonosHoja[i % 3], 0.9)));
    hoja.scale.set(0.16, 0.5, 0.05);
    const a = (i / 9) * Math.PI * 2;
    hoja.position.set(Math.cos(a) * 0.14, 0.95 + (i % 3) * 0.08, Math.sin(a) * 0.14);
    hoja.rotation.set(Math.sin(a) * 0.55, -a, Math.cos(a) * 0.55);
    planta.add(hoja);
  }
  planta.position.set(-3.2, 0, -1.9);
  scene.add(planta);

  // sillón huevo
  const SILLON = { x: 2.0, z: -0.35, asiento: 0.52 };
  const sillon = new THREE.Group();
  const mostaza = std('#D6A04A', 0.97), mostazaClara = std('#E4B866', 0.97);
  const concha = sombra(new THREE.Mesh(
    new THREE.SphereGeometry(0.95, 48, 32, Math.PI / 2 + 0.66, Math.PI * 2 - 1.32, 0, Math.PI * 0.72),
    new THREE.MeshStandardMaterial({ color: col('#D6A04A'), roughness: 0.97, side: THREE.DoubleSide })
  ));
  concha.scale.set(1, 0.9, 0.95); concha.position.y = 0.95;
  const asiento = sombra(new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.68, 0.2, 48), mostazaClara));
  asiento.position.y = 0.42;
  const cojinAtras = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), mostazaClara));
  cojinAtras.scale.set(1, 0.9, 0.55); cojinAtras.position.set(0, 0.86, -0.5);
  const pie_ = sombra(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.36, 32), mostaza));
  pie_.position.y = 0.2;
  const aro = sombra(new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.62, 0.05, 48), std('#C8A15C', 0.35, { metalness: 0.4 })));
  aro.position.y = 0.025;
  sillon.add(concha, asiento, cojinAtras, pie_, aro);
  sillon.position.set(SILLON.x, 0, SILLON.z);
  scene.add(sillon);

  // escritorio, puf y computadora
  const PUF = { x: -1.75, z: 0.25, asiento: 0.38 };
  const ANG_ESCRITORIO = -1.45;
  const adelante = new THREE.Vector3(Math.sin(ANG_ESCRITORIO), 0, Math.cos(ANG_ESCRITORIO));
  const puf = new THREE.Group();
  puf.add(sombra(en(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.3, 40), std('#9DB89F', 0.95)), 0, 0.15, 0)));
  const tapa = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.34, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), std('#A9C2AB', 0.95)));
  tapa.scale.y = 0.24; tapa.position.y = 0.3; puf.add(tapa);
  puf.position.set(PUF.x, 0, PUF.z);
  scene.add(puf);

  const escritorio = new THREE.Group();
  const maderaClara = std('#D8B48A', 0.7);
  escritorio.add(sombra(en(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 48), maderaClara), 0, 0.8, 0)));
  escritorio.add(sombra(en(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.78, 16), std('#B98E62', 0.7)), 0, 0.39, 0)));
  escritorio.add(sombra(en(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.04, 32), std('#B98E62', 0.7)), 0, 0.02, 0)));
  const centroEscritorio = new THREE.Vector3(PUF.x, 0, PUF.z).addScaledVector(adelante, 0.78);
  escritorio.position.copy(centroEscritorio);
  scene.add(escritorio);

  const pantallaTex = lienzo(512, 320, () => {});
  function dibujarPantalla(consulta, fase) {
    const { g } = pantallaTex.userData;
    const w = 512, hh = 320;
    g.fillStyle = '#FFFDF8'; g.fillRect(0, 0, w, hh);
    g.fillStyle = '#F1E6D6'; g.fillRect(0, 0, w, 40);
    ['#E28E6A', '#E2A83E', '#8FAF93'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(22 + i * 20, 20, 6, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = '#FFFFFF'; redondo(g, 40, 64, w - 80, 48, 24); g.fill();
    g.strokeStyle = '#E2A83E'; g.lineWidth = 3; redondo(g, 40, 64, w - 80, 48, 24); g.stroke();
    g.fillStyle = '#3A322C'; g.font = "500 22px 'Figtree', sans-serif"; g.textBaseline = 'middle';
    g.fillText(consulta + (fase === 0 && Math.floor(performance.now() / 400) % 2 ? '|' : ''), 64, 89);
    if (fase >= 1) {
      for (let i = 0; i < 3; i++) {
        const y = 138 + i * 58;
        g.fillStyle = '#A8701A'; redondo(g, 40, y, 220 - i * 30, 14, 7); g.fill();
        g.fillStyle = '#E6DACB'; redondo(g, 40, y + 22, w - 120, 10, 5); g.fill();
        redondo(g, 40, y + 38, w - 180 + i * 20, 10, 5); g.fill();
      }
    }
    pantallaTex.needsUpdate = true;
  }
  dibujarPantalla('', -1);

  const laptop = new THREE.Group();
  const plata = std('#D5CFC6', 0.45, { metalness: 0.2 });
  laptop.add(sombra(en(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.022, 0.32), plata), 0, 0.011, 0)));
  const bisagra = new THREE.Group();
  bisagra.position.set(0, 0.022, -0.16);
  const tapaLaptop = sombra(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.3, 0.014), plata));
  tapaLaptop.position.set(0, 0.15, 0);
  const pantalla = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.26), new THREE.MeshBasicMaterial({ map: pantallaTex }));
  pantalla.position.set(0, 0.15, 0.0085);
  bisagra.add(tapaLaptop, pantalla);
  laptop.add(bisagra);
  laptop.position.copy(centroEscritorio).setY(0.825);
  laptop.rotation.y = Math.atan2(-adelante.x, -adelante.z);
  scene.add(laptop);
  let tapaAbierta = 0, tapaObj = 0;

  /* ---------- Aura ---------- */
  const R = 0.56, ALTO = 1.25, BASE_Y = 0.12, ESC = 1.22;
  const radio = (y) => {
    const t = Math.min(1, Math.max(0, y / ALTO));
    return R * Math.pow(1 - Math.pow(Math.abs(2 * t - 1), 2.4), 1 / 2.4) * (1 - 0.1 * t);
  };
  const perfil = [];
  for (let i = 0; i <= 40; i++) { const y = (i / 40) * ALTO; perfil.push(new THREE.Vector2(radio(y), y)); }

  const aura = new THREE.Group();
  const cuerpo = new THREE.Group();
  cuerpo.position.y = BASE_Y;
  aura.add(cuerpo);
  const matPiel = std('#F3E6CD', 0.5);
  const piel = sombra(new THREE.Mesh(new THREE.LatheGeometry(perfil, 64), matPiel));
  cuerpo.add(piel);

  const enSuperficie = (x, y, dentro = 0) => {
    const r = radio(y);
    return new THREE.Vector3(x, y, Math.sqrt(Math.max(0, r * r - x * x)) - dentro);
  };

  const tinta = std('#2F2924', 0.3);
  function ojo(x) {
    const g = new THREE.Group();
    g.position.copy(enSuperficie(x, 0.84, 0.02));
    const globo = new THREE.Mesh(new THREE.SphereGeometry(0.072, 24, 16), tinta);
    globo.scale.z = 0.7;
    const brillo = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), basica('#FFFFFF'));
    brillo.position.set(0.024, 0.028, 0.047);
    g.add(globo, brillo);
    cuerpo.add(g);
    return g;
  }
  const ojoI = ojo(-0.17), ojoD = ojo(0.17);

  function mejilla(x) {
    const m = new THREE.Mesh(new THREE.CircleGeometry(0.06, 24), basica('#F2A48B', { transparent: true, opacity: 0.5 }));
    const p = enSuperficie(x, 0.74, -0.004);
    m.position.copy(p);
    m.lookAt(p.clone().add(new THREE.Vector3(p.x, 0, p.z)));
    cuerpo.add(m);
    return m;
  }
  const mejillas = [mejilla(-0.29), mejilla(0.29)];

  const matBoca = std('#4A2A26', 0.5);
  const bocaSonrisa = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 8, 24, Math.PI), matBoca);
  bocaSonrisa.rotation.z = Math.PI;
  const bocaTriste = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 24, Math.PI), matBoca);
  bocaTriste.position.y = -0.03;
  const bocaAbierta = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 12), matBoca);
  const bocaO = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.013, 8, 20), matBoca);
  const boca = new THREE.Group();
  boca.position.copy(enSuperficie(0, 0.71, -0.005));
  boca.add(bocaSonrisa, bocaTriste, bocaAbierta, bocaO);
  cuerpo.add(boca);

  const verde = std('#9DBC9A', 0.95), verdeOsc = std('#8AAE89', 0.95);
  const bufanda = sombra(new THREE.Mesh(new THREE.TorusGeometry(radio(0.52) + 0.005, 0.07, 14, 56), verde));
  bufanda.rotation.x = Math.PI / 2; bufanda.position.y = 0.52;
  cuerpo.add(bufanda);
  const colaBufanda = new THREE.Group();
  colaBufanda.position.set(0.2, 0.47, radio(0.47) - 0.02);
  for (let i = 0; i < 2; i++) {
    const tira = sombra(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.26, 0.04), i ? verdeOsc : verde));
    tira.position.set(i * 0.05, -0.12 - i * 0.04, 0.02 + i * 0.01);
    tira.rotation.z = 0.12 + i * 0.1;
    colaBufanda.add(tira);
  }
  cuerpo.add(colaBufanda);

  function brazo(lado) {
    const pivote = new THREE.Group();
    pivote.position.set(lado * 0.5, 0.56, 0);
    const m = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), matPiel));
    m.scale.set(0.11, 0.2, 0.11); m.position.set(lado * 0.04, -0.16, 0);
    pivote.add(m);
    cuerpo.add(pivote);
    return pivote;
  }
  const brazoI = brazo(-1), brazoD = brazo(1);

  const pieI = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 14), matPiel));
  const pieD = sombra(new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 14), matPiel));
  pieI.scale.set(1, 0.55, 1.3); pieD.scale.set(1, 0.55, 1.3);
  aura.add(pieI, pieD);

  const anilloEje = new THREE.Group();
  anilloEje.position.y = BASE_Y + 0.5;
  anilloEje.rotation.set(0.32, 0, -0.16);
  const anilloGiro = new THREE.Group();
  const matAnillo = basica('#F2BE4E', { transparent: true });
  const matHalo = basica('#FFD27A', { transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false });
  const anillo = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.013, 12, 160), matAnillo);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.05, 12, 160), matHalo);
  anillo.rotation.x = halo.rotation.x = Math.PI / 2;
  anilloGiro.add(anillo, halo);
  for (let i = 0; i < 4; i++) {
    const chispa = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 8), basica('#FFF0C2'));
    const a = (i / 4) * Math.PI * 2;
    chispa.position.set(Math.cos(a) * 0.86, 0, Math.sin(a) * 0.86);
    anilloGiro.add(chispa);
  }
  anilloEje.add(anilloGiro);
  aura.add(anilloEje);
  aura.scale.setScalar(ESC);
  scene.add(aura);

  /* ---------- objetos que sostiene ---------- */
  function hoja(w, h, tex, fondo = '#FFFFFF') {
    const g = new THREE.Group();
    const cara = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, side: THREE.DoubleSide }));
    const canto = new THREE.Mesh(new THREE.BoxGeometry(w + 0.01, h + 0.01, 0.008), std(fondo, 0.8));
    canto.position.z = -0.006;
    g.add(canto, cara);
    g.visible = false;
    cuerpo.add(g);
    return g;
  }
  const libretaTex = lienzo(256, 320, () => {});
  let lineasLibreta = 0;
  function dibujarLibreta(n) {
    const { g } = libretaTex.userData;
    g.fillStyle = '#FFFBF1'; g.fillRect(0, 0, 256, 320);
    g.fillStyle = '#E2A83E'; g.fillRect(0, 0, 256, 26);
    g.strokeStyle = '#EADFCB'; g.lineWidth = 2;
    for (let y = 70; y < 320; y += 38) { g.beginPath(); g.moveTo(20, y); g.lineTo(236, y); g.stroke(); }
    g.strokeStyle = '#3A322C'; g.lineWidth = 5; g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const y = 62 + i * 38, largo = [170, 196, 120, 150, 90][i % 5];
      g.beginPath(); g.moveTo(26, y);
      for (let x = 26; x < 26 + largo; x += 14) g.quadraticCurveTo(x + 4, y - 9, x + 7, y - 2);
      g.stroke();
    }
    libretaTex.needsUpdate = true;
  }
  dibujarLibreta(0);
  const libreta = hoja(0.24, 0.3, libretaTex, '#E2A83E');
  libreta.position.set(-0.08, 0.36, 0.64); libreta.rotation.x = -0.55;
  const lapiz = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.2, 10), std('#E28E6A', 0.6));
  lapiz.visible = false; cuerpo.add(lapiz);

  const oroTex = lienzo(420, 280, (g, w, hh) => {
    g.fillStyle = '#FFFDF6'; g.fillRect(0, 0, w, hh);
    g.fillStyle = '#A8701A'; g.font = "600 34px 'Fredoka', sans-serif"; g.fillText('Oro', 28, 52);
    g.fillStyle = '#8B7E72'; g.font = "500 18px 'Figtree', sans-serif"; g.fillText('esta semana · ejemplo', 28, 82);
    const pts = [200, 214, 196, 222, 230, 218, 246, 240, 258];
    g.beginPath(); pts.forEach((v, i) => { const x = 28 + i * 45, y = hh - (v - 150); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.lineWidth = 7; g.strokeStyle = '#E2A83E'; g.lineJoin = 'round'; g.stroke();
    g.lineTo(28 + 8 * 45, hh); g.lineTo(28, hh); g.closePath(); g.fillStyle = 'rgba(226,168,62,0.18)'; g.fill();
  });
  const tarjetaOro = hoja(0.5, 0.33, oroTex, '#F3DDB0');
  tarjetaOro.position.set(0, 1.48, 0.28); tarjetaOro.rotation.x = 0.08;

  const docTex = lienzo(300, 390, (g, w, hh) => {
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, w, hh);
    g.fillStyle = '#3A322C'; redondo(g, 26, 30, 150, 16, 8); g.fill();
    g.fillStyle = '#D9CDBD';
    for (let y = 72; y < hh - 30; y += 26) { redondo(g, 26, y, w - 52 - ((y * 7) % 60), 10, 5); g.fill(); }
    g.fillStyle = '#E28E6A'; redondo(g, w - 82, 26, 56, 26, 8); g.fill();
    g.fillStyle = '#FFFFFF'; g.font = "600 16px 'Figtree', sans-serif"; g.fillText('PDF', w - 70, 45);
  });
  const documento = hoja(0.3, 0.39, docTex, '#EFE6D8');
  documento.position.set(0, 0.46, 0.66); documento.rotation.x = -0.35;

  // avión de papel
  const geoAvion = new THREE.BufferGeometry();
  geoAvion.setAttribute('position', new THREE.Float32BufferAttribute([
    0, 0, 0.22, -0.13, 0, -0.1, 0, 0.012, -0.06,
    0, 0, 0.22, 0, 0.012, -0.06, 0.13, 0, -0.1,
    0, 0, 0.22, 0, 0.012, -0.06, 0, -0.06, -0.08,
  ], 3));
  geoAvion.computeVertexNormals();
  const avion = new THREE.Mesh(geoAvion, new THREE.MeshStandardMaterial({ color: col('#FFFFFF'), roughness: 0.7, side: THREE.DoubleSide, transparent: true }));
  avion.castShadow = true; avion.visible = false; avion.scale.setScalar(1.6);
  cuerpo.add(avion);

  /* ---------- partículas ---------- */
  const texturasTexto = {};
  function texTexto(txt, color) {
    const k = txt + color;
    if (!texturasTexto[k]) texturasTexto[k] = lienzo(128, 128, (g, w, hh) => {
      g.font = "600 92px 'Fredoka', 'Figtree', sans-serif"; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = color; g.fillText(txt, w / 2, hh / 2 + 4);
    });
    return texturasTexto[k];
  }
  const particulas = [];
  function soltarTexto(txt, color, desde, vel, vida = 2.2, tam = 0.28) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texTexto(txt, color), transparent: true, depthWrite: false }));
    s.scale.set(tam, tam, tam); s.position.copy(desde);
    scene.add(s);
    particulas.push({ obj: s, vel, vida, max: vida, gira: (Math.random() - 0.5) * 1.2 });
  }
  const geoChispa = new THREE.SphereGeometry(0.03, 8, 6);
  function estallido(centro, n = 16) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geoChispa, basica(i % 2 ? '#FFD27A' : '#FFF0C2', { transparent: true }));
      m.position.copy(centro);
      scene.add(m);
      particulas.push({ obj: m, vel: new THREE.Vector3((Math.random() - 0.5) * 2.2, Math.random() * 1.8 + 0.4, (Math.random() - 0.5) * 1.2), vida: 1.1, max: 1.1, gravedad: 2.2 });
    }
  }

  /* ---------- estado y acciones ---------- */
  const LUGAR = {
    centro: { x: 0, z: 0.55, ang: 0 },
    sillon: { x: SILLON.x, z: SILLON.z + 1.05, ang: 0, sx: SILLON.x, sz: SILLON.z + 0.12, sy: SILLON.asiento - BASE_Y * ESC },
    escritorio: { x: PUF.x - adelante.x * 0.75, z: PUF.z - adelante.z * 0.75 + 0.2, ang: ANG_ESCRITORIO, sx: PUF.x, sz: PUF.z, sy: PUF.asiento - BASE_Y * ESC },
  };
  const st = {
    x: -4.8, y: 0, z: 0.55, rotY: Math.PI / 2, rotObj: Math.PI / 2,
    fase: 0, caminando: false, lugar: 'suelo', sentado: false, dormido: false,
    emo: 'feliz', emoHasta: 0, gesto: null, hablando: false, reloj: 0,
    proxParpadeo: 2, parpadeo: 0, mirarX: 0, mirarY: 0, proxZeta: 0, proxNota: 0,
    postura: 'pie', leer: 0,
  };
  const P = { ojoY: 1, ojoS: 1, ojoMY: 0, ojoMX: 0, inclX: 0, inclZ: 0, escY: 1, anilloV: 0.6, anilloOp: 1,
              bIz: -0.25, bIx: 0, bDz: 0.25, bDx: 0, mej: 0.5 };

  const cola = [];
  const hacer = (...a) => cola.push(...a);
  function vaciar() {
    for (const a of cola) if (a.listo && a.fin) a.fin(a);
    cola.length = 0; st.caminando = false; st.gesto = null; callar();
    [libreta, lapiz, tarjetaOro, documento, avion].forEach((o) => { o.visible = false; });
  }
  function avanzar(dt) {
    const a = cola[0];
    if (!a) return;
    if (!a.listo) { a.listo = true; a.t = 0; a.inicio && a.inicio(a); }
    a.t += dt;
    if (a.update(dt, a)) { cola.shift(); a.fin && a.fin(a); }
  }
  const caminarA = (x, z) => ({
    update(dt) {
      const dx = x - st.x, dz = z - st.z, d = Math.hypot(dx, dz);
      if (d < 0.03) { st.x = x; st.z = z; st.caminando = false; return true; }
      st.rotObj = Math.atan2(dx, dz);
      const paso = Math.min(d, 1.2 * dt);
      st.x += (dx / d) * paso; st.z += (dz / d) * paso;
      st.caminando = true;
      return false;
    },
  });
  const girar = (ang) => ({ update() { st.rotObj = ang; return Math.abs(Math.atan2(Math.sin(st.rotY - ang), Math.cos(st.rotY - ang))) < 0.05; } });
  const esperar = (s) => ({ update(dt, a) { return a.t >= s; } });
  const hecho = (fn) => ({ update() { fn(); return true; } });
  const estado = (txt) => hecho(() => { estadoTxt.textContent = txt; });
  const salto = (hx, hy, hz, onFin) => ({
    inicio(a) { a.d = { x: st.x, y: st.y, z: st.z }; },
    update(dt, a) {
      const k = Math.min(1, a.t / 0.7), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      st.x = a.d.x + (hx - a.d.x) * e; st.z = a.d.z + (hz - a.d.z) * e;
      st.y = a.d.y + (hy - a.d.y) * e + Math.sin(Math.PI * k) * 0.35;
      return k >= 1;
    },
    fin() { onFin && onFin(); },
  });
  const decir = (texto, emo = 'feliz', queda = 1.6) => ({
    inicio() { ponerEmo(emo, texto.length / 26 + queda + 0.5); st.hablando = true; burbuja.hidden = false; burbuja.textContent = ''; },
    update(dt, a) {
      const n = Math.floor(a.t * 26);
      burbuja.textContent = texto.slice(0, n);
      if (n >= texto.length) st.hablando = false;
      return a.t >= texto.length / 26 + queda;
    },
    fin() { callar(); },
  });
  function callar() { st.hablando = false; burbuja.hidden = true; }
  function ponerEmo(emo, seg = 3.2) { st.emo = emo; st.emoHasta = st.reloj + seg; }

  // llevarla a un sitio, levantándose primero de donde esté
  function irA(dest) {
    const pasos = [];
    if (st.lugar === dest) return [girar(LUGAR[dest].ang)];
    if (st.lugar === 'sillon' || st.lugar === 'escritorio') {
      const L = LUGAR[st.lugar];
      if (st.lugar === 'escritorio') pasos.push(hecho(() => { tapaObj = 0; }));
      pasos.push(salto(L.x, 0, L.z, () => { st.sentado = false; st.lugar = 'suelo'; }));
    }
    const D = LUGAR[dest];
    pasos.push(caminarA(D.x, D.z), girar(D.ang));
    if (D.sy !== undefined) pasos.push(salto(D.sx, D.sy, D.sz, () => { st.sentado = true; st.lugar = dest; }));
    else pasos.push(hecho(() => { st.lugar = dest; }));
    return pasos;
  }

  const frases = {
    pie: [
      'Estoy aquí. Pregúntame lo que quieras: el oro, tus pendientes o cómo va la cadena.',
      'Si algo importante pasa, vengo caminando hasta el centro a avisarte.',
    ],
    sentada: [
      'Desde mi sillón te cuento el resumen del día, con calma.',
      'Aquí sentada te escucho. ¿Qué revisamos primero?',
    ],
  };
  let fraseN = 0;

  function entrada() {
    vaciar();
    tapaObj = 0;
    st.sentado = false; st.dormido = false; st.y = 0; st.emo = 'feliz'; st.lugar = 'suelo';
    actualizarChips();
    const bienvenida = `${saludo}, José. Soy Aura. ¿En qué te ayudo?`;
    if (reducido) {
      Object.assign(st, { x: 0, z: 0.55, rotY: 0, rotObj: 0, lugar: 'centro' });
      hacer(decir(bienvenida, 'feliz', 2.4));
      return;
    }
    Object.assign(st, { x: -4.8, z: 0.55, rotY: Math.PI / 2, rotObj: Math.PI / 2 });
    hacer(estado('Llegando'), esperar(0.4), caminarA(0, 0.55), girar(0), hecho(() => { st.lugar = 'centro'; }),
          saludar(), decir(bienvenida, 'feliz', 2.4), estado('Contigo'));
  }
  const saludar = () => ({ inicio() { st.gesto = 'saludo'; }, update(dt, a) { return a.t >= 1.8; }, fin() { st.gesto = null; } });

  /* ----- lo que hace ----- */
  function buscar() {
    const consulta = 'precio del oro hoy';
    hacer(estado('Buscando en internet'), ...irA('escritorio'),
      hecho(() => { tapaObj = 1; dibujarPantalla('', 0); }), esperar(0.7),
      {
        inicio() { st.gesto = 'teclear'; ponerEmo('pensando', 99); },
        update(dt, a) {
          const n = Math.min(consulta.length, Math.floor(a.t * 9));
          dibujarPantalla(consulta.slice(0, n), 0);
          burbuja.hidden = false; burbuja.textContent = 'Buscando: ' + consulta.slice(0, n) + (n < consulta.length ? '▍' : '…');
          st.leer = Math.sin(a.t * 6) * 0.6;
          return a.t >= consulta.length / 9 + 0.5;
        },
      },
      {
        inicio() { st.gesto = 'mirar-pantalla'; dibujarPantalla(consulta, 1); },
        update(dt, a) { st.leer = Math.sin(a.t * 3) * 0.8; return a.t >= 1.6; },
        fin() { st.gesto = null; st.leer = 0; st.emoHasta = 0; callar(); },
      },
      girar(ANG_ESCRITORIO + 0.9),
      decir('Listo, lo encontré. ¿Te lo leo o te lo mando por Telegram?', 'feliz', 2),
      estado('Contigo'));
  }

  function enviar() {
    hacer(estado('Enviando'), ...irA('centro'),
      { inicio() { avion.visible = true; st.gesto = 'preparar'; ponerEmo('feliz', 4); }, update(dt, a) { return a.t >= 0.9; } },
      {
        inicio(a) {
          st.gesto = 'lanzar';
          avion.updateMatrixWorld();
          a.desde = new THREE.Vector3(); avion.getWorldPosition(a.desde);
          avion.visible = false;
          a.vuelo = avion.clone(); a.vuelo.material = avion.material.clone(); a.vuelo.scale.setScalar(ESC * 1.6);
          a.vuelo.position.copy(a.desde); scene.add(a.vuelo);
          a.medio = new THREE.Vector3(0.6, 2.6, -0.2); a.hasta = VENTANA.clone().setZ(-2.4);
        },
        update(dt, a) {
          if (a.t > 0.25) st.gesto = null;
          const k = Math.min(1, a.t / 1.8), q = 1 - k;
          const p = new THREE.Vector3().addScaledVector(a.desde, q * q).addScaledVector(a.medio, 2 * q * k).addScaledVector(a.hasta, k * k);
          const d = new THREE.Vector3().addScaledVector(a.medio.clone().sub(a.desde), 2 * q).addScaledVector(a.hasta.clone().sub(a.medio), 2 * k);
          a.vuelo.position.copy(p);
          a.vuelo.lookAt(p.clone().add(d));
          a.vuelo.rotateZ(Math.sin(a.t * 8) * 0.3);
          a.vuelo.scale.setScalar(ESC * 1.6 * (1 - k * 0.6));
          a.vuelo.material.opacity = k > 0.85 ? (1 - k) / 0.15 : 1;
          return k >= 1;
        },
        fin(a) { if (a.vuelo) { scene.remove(a.vuelo); a.vuelo.material.dispose(); } },
      },
      decir('¡Enviado! Te llega por Telegram en un momento.', 'feliz', 1.8),
      estado('Contigo'));
  }

  function anotar() {
    hacer(estado('Anotando'), ...irA(st.postura === 'sentada' ? 'sillon' : 'centro'),
      { inicio() { libreta.visible = lapiz.visible = true; dibujarLibreta(0); st.gesto = 'escribir'; ponerEmo('pensando', 99); },
        update(dt, a) {
          const n = Math.min(5, Math.floor(a.t / 0.5));
          if (n !== lineasLibreta) { lineasLibreta = n; dibujarLibreta(n); }
          return a.t >= 2.8;
        },
        fin() { st.gesto = 'sostener-libreta'; st.emoHasta = 0; lapiz.visible = false; } },
      decir('Anotado. Te lo recuerdo a la hora que me digas.', 'feliz', 1.6),
      hecho(() => { libreta.visible = false; st.gesto = null; }),
      estado('Contigo'));
  }

  function mostrarOro() {
    hacer(estado('Mostrando el oro'), ...irA(st.postura === 'sentada' ? 'sillon' : 'centro'),
      { inicio() { tarjetaOro.visible = true; st.gesto = 'levantar'; ponerEmo('orgullo', 99); }, update(dt, a) { return a.t >= 0.6; } },
      decir('Así va el oro esta semana. ¿Quieres que te avise si se mueve fuerte?', 'feliz', 1.8),
      hecho(() => { tarjetaOro.visible = false; st.gesto = null; st.emoHasta = 0; }),
      estado('Contigo'));
  }

  function leer() {
    hacer(estado('Leyendo'), ...irA(st.postura === 'sentada' ? 'sillon' : 'centro'),
      { inicio() { documento.visible = true; st.gesto = 'sostener-doc'; ponerEmo('pensando', 99); },
        update(dt, a) { st.leer = -((a.t * 0.9) % 1) * 1.6 + 0.4; return a.t >= 3; },
        fin() { st.leer = 0; st.emoHasta = 0; } },
      decir('Ya lo leí. ¿Te hago un resumen de un minuto?', 'feliz', 1.8),

      estado('Contigo'));
  }

  function contestar() {
    const lista = frases[st.postura];
    const dest = st.postura === 'sentada' ? 'sillon' : 'centro';
    hacer(estado('Contestando'), ...irA(dest),
      { inicio() { st.gesto = 'explicar'; }, update() { return true; } },
      decir(lista[fraseN++ % lista.length], 'feliz', 1.8),
      hecho(() => { st.gesto = null; }), estado('Contigo'));
  }

  function accion(nombre) {
    if (st.dormido && nombre !== 'dormir' && nombre !== 'entrar') { despertar(); return; }
    const ocupado = cola.length > 0;
    const plano = (fn) => { if (ocupado) vaciar(); fn(); };
    switch (nombre) {
      case 'buscar': plano(buscar); break;
      case 'enviar': plano(enviar); break;
      case 'anotar': plano(anotar); break;
      case 'oro': plano(mostrarOro); break;
      case 'leer': plano(leer); break;
      case 'saludar': if (!ocupado) hacer(girar(LUGAR[st.lugar] ? LUGAR[st.lugar].ang : 0), saludar(), decir('¡Hola! Qué bueno verte.', 'feliz')); break;
      case 'feliz': ponerEmo('feliz'); estallido(cabeza(0.75)); if (!ocupado) hacer(decir('¡Eso me pone feliz!', 'feliz')); break;
      case 'pensando': ponerEmo('pensando', 3.6); if (!ocupado) hacer(decir('Mmm… déjame pensarlo un segundo.', 'pensando')); break;
      case 'sorpresa': ponerEmo('sorpresa', 2.4); if (!ocupado) hacer(decir('¡Uy! Eso no me lo esperaba.', 'sorpresa')); break;
      case 'triste': ponerEmo('triste', 3.4); if (!ocupado) hacer(decir('Lo siento. De verdad lo siento.', 'triste')); break;
      case 'risa': ponerEmo('risa', 2.4); if (!ocupado) hacer(decir('¡Je je! Esa estuvo buena.', 'risa')); break;
      case 'canto': ponerEmo('canto', 5); if (!ocupado) hacer(decir('♪ La la la, un día bonito en Orden Global ♪', 'canto', 2.2)); break;
      case 'dormir': st.dormido ? despertar() : dormir(); break;
      case 'entrar': entrada(); break;
    }
  }
  function dormir() {
    vaciar();
    hacer(estado('Durmiendo'), ...irA('sillon'), hecho(() => { st.dormido = true; st.emo = 'dormido'; st.emoHasta = Infinity; actualizarChips(); }));
  }
  function despertar() {
    st.dormido = false; st.emoHasta = 0;
    actualizarChips();
    vaciar();
    hacer(decir('¡Ya desperté! ¿Qué necesitas?', 'sorpresa'), estado('Contigo'));
  }
  function actualizarChips() {
    document.getElementById('chip-dormir').textContent = st.dormido ? 'Despertar' : 'Dormir';
  }
  function cabeza(alto) { return new THREE.Vector3(st.x, st.y + (BASE_Y + alto) * ESC, st.z); }

  document.querySelectorAll('[data-accion]').forEach((b) => b.addEventListener('click', () => accion(b.dataset.accion)));
  document.getElementById('mic').addEventListener('click', () => {
    if (st.dormido) { despertar(); return; }
    if (cola.length) vaciar();
    contestar();
  });
  const bPie = document.getElementById('pie'), bSentada = document.getElementById('sentada');
  function postura(p) {
    st.postura = p;
    bPie.setAttribute('aria-pressed', String(p === 'pie'));
    bSentada.setAttribute('aria-pressed', String(p === 'sentada'));
    if (st.dormido) st.dormido = false;
    vaciar();
    contestar();
  }
  bPie.addEventListener('click', () => postura('pie'));
  bSentada.addEventListener('click', () => postura('sentada'));

  /* ---------- tocar y mirar ---------- */
  const ray = new THREE.Raycaster();
  const puntero = new THREE.Vector2();
  const aPantalla = (e) => { const r = cont.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
  cont.addEventListener('pointermove', (e) => puntero.copy(aPantalla(e)));
  cont.addEventListener('pointerleave', () => puntero.set(0, 0));
  cont.addEventListener('pointerdown', (e) => {
    ray.setFromCamera(aPantalla(e), camera);
    if (ray.intersectObjects([piel, brazoI.children[0], brazoD.children[0]], false).length) {
      if (st.dormido) { despertar(); return; }
      ponerEmo('risa', 1.8);
      if (!cola.length) hacer(decir('¡Ay, cosquillas! Je je.', 'risa', 1));
    }
  });

  /* ---------- cámara ---------- */
  let angosto = false;
  const mira = new THREE.Vector3(0.2, 1.0, 0);
  function medir() {
    const w = cont.clientWidth, hh = cont.clientHeight;
    renderer.setSize(w, hh, false);
    camera.aspect = w / hh;
    angosto = camera.aspect < 1.1;
    camera.fov = angosto ? 44 : 38;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(medir).observe(cont);
  medir();

  const lerp = (a, b, k) => a + (b - a) * k;
  const angLerp = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; };
  const v3 = new THREE.Vector3();

  /* ---------- cada cuadro ---------- */
  let antes = performance.now();
  function cuadro(ahora) {
    const dt = Math.min(0.05, (ahora - antes) / 1000);
    antes = ahora;
    st.reloj += dt;
    const t = st.reloj;
    avanzar(dt);
    if (!st.dormido && st.emoHasta && t > st.emoHasta) { st.emo = 'neutral'; st.emoHasta = 0; }

    const o = { ojoY: 1, ojoS: 1, ojoMY: 0, ojoMX: 0, inclX: 0, inclZ: 0, escY: 1, anilloV: 0.6, anilloOp: 1, bIz: -0.25, bIx: 0, bDz: 0.25, bDx: 0, mej: 0.5, boca: 'sonrisa' };
    switch (st.emo) {
      case 'pensando': o.ojoMY = 0.02; o.inclZ = 0.08; o.anilloV = 0.3; o.boca = 'o'; if (!st.gesto) { o.bDx = -2.1; o.bDz = -0.35; } break;
      case 'sorpresa': o.ojoS = 1.35; o.boca = 'o'; o.anilloV = 2.2; o.bIz = -0.9; o.bDz = 0.9; o.inclX = -0.08; break;
      case 'triste': o.ojoMY = -0.03; o.inclX = 0.16; o.escY = 0.94; o.anilloV = 0.15; o.anilloOp = 0.4; o.boca = 'triste'; o.bIz = -0.08; o.bDz = 0.08; o.mej = 0.2; break;
      case 'risa': o.ojoY = 0.35; o.boca = 'abierta'; o.inclZ = Math.sin(t * 22) * 0.1; o.anilloV = 1.6; o.mej = 0.8; break;
      case 'canto': o.boca = 'abierta'; o.inclZ = Math.sin(t * 3) * 0.14; o.bIz = -0.8 + Math.sin(t * 3) * 0.2; o.bDz = 0.8 + Math.sin(t * 3) * 0.2; o.anilloV = 1.2; o.ojoY = 0.55; break;
      case 'dormido': o.ojoY = 0.08; o.boca = 'o'; o.escY = 1 + Math.sin(t * 1.3) * 0.03; o.anilloV = 0.12; o.anilloOp = 0.45; o.inclZ = 0.1; o.bIz = -0.12; o.bDz = 0.12; break;
      case 'orgullo': o.mej = 0.75; o.anilloV = 1.1; break;
      case 'feliz': o.mej = 0.7; o.anilloV = 0.9; break;
    }
    if (st.hablando && o.boca !== 'triste') o.boca = 'abierta';
    if (st.sentado && !st.caminando) { o.bIz = -0.55; o.bDz = 0.55; }
    switch (st.gesto) {
      case 'saludo': o.bDz = 2.5 + Math.sin(t * 14) * 0.35; o.bDx = -0.2; break;
      case 'teclear': o.bIx = -1.25 + Math.sin(t * 24) * 0.12; o.bDx = -1.25 - Math.sin(t * 24) * 0.12; o.bIz = -0.12; o.bDz = 0.12; o.inclX = 0.12; o.ojoMY = -0.02; break;
      case 'mirar-pantalla': o.bIx = -1.1; o.bDx = -1.1; o.bIz = -0.12; o.bDz = 0.12; o.inclX = 0.1; o.ojoMY = -0.015; o.ojoS = 1.12; break;
      case 'preparar': o.bDx = 0.35; o.bDz = 2.2; o.inclZ = 0.12; o.inclX = -0.05; break;
      case 'lanzar': o.bDx = -2.3; o.bDz = 0.4; o.inclX = 0.12; break;
      case 'escribir': o.bIx = -1.2; o.bIz = 0.05; o.bDx = -1.05 + Math.sin(t * 18) * 0.08; o.bDz = -0.25 + Math.sin(t * 9) * 0.08; o.inclX = 0.1; o.ojoMY = -0.03; break;
      case 'sostener-libreta': o.bIx = -1.2; o.bIz = 0.05; break;
      case 'levantar': o.bIx = -2.3; o.bDx = -2.3; o.bIz = 0.1; o.bDz = -0.1; o.inclX = -0.06; break;
      case 'sostener-doc': o.bIx = -1.25; o.bDx = -1.25; o.bIz = 0.02; o.bDz = -0.02; o.inclX = 0.1; break;
      case 'explicar': if (st.hablando) { o.bDz = 0.55 + Math.max(0, Math.sin(t * 3.2)) * 0.7; o.bDx = -0.6 - Math.max(0, Math.sin(t * 3.2)) * 0.4; o.bIz = st.sentado ? -0.55 : -0.3 - Math.max(0, Math.sin(t * 3.2 + 2)) * 0.4; } break;
    }
    if (st.caminando) { o.bIx = Math.sin(st.fase) * 0.55; o.bDx = -Math.sin(st.fase) * 0.55; o.bIz = -0.25; o.bDz = 0.25; }
    o.ojoMX = st.leer * 0.03;

    const k = 1 - Math.pow(0.001, dt);
    for (const c of Object.keys(P)) P[c] = lerp(P[c], o[c], k);

    if (t > st.proxParpadeo) { st.parpadeo = 0.14; st.proxParpadeo = t + 2.2 + Math.random() * 3; }
    const cierre = st.parpadeo > 0 ? 0.1 : 1;
    st.parpadeo = Math.max(0, st.parpadeo - dt);

    const libre = !st.caminando && !st.dormido && !st.gesto && Math.abs(st.rotObj) < 0.01;
    st.mirarX = lerp(st.mirarX, libre ? puntero.x : 0, k * 0.6);
    st.mirarY = lerp(st.mirarY, libre ? puntero.y : 0, k * 0.6);

    st.rotY = angLerp(st.rotY, st.rotObj + (libre ? st.mirarX * 0.35 : 0), 1 - Math.pow(0.0005, dt));
    if (st.caminando) st.fase += dt * 9.5;
    const brinco = st.emo === 'feliz' && st.emoHasta && !st.caminando && !st.sentado && !st.gesto && !reducido ? Math.abs(Math.sin(t * 7)) * 0.1 : 0;
    const bote = st.caminando ? Math.abs(Math.sin(st.fase)) * 0.05 : 0;
    aura.position.set(st.x, st.y + brinco + bote, st.z);
    aura.rotation.y = st.rotY;

    const resp = 1 + Math.sin(t * 2.2) * 0.015;
    cuerpo.scale.set(1 / Math.sqrt(P.escY * resp), P.escY * resp, 1 / Math.sqrt(P.escY * resp));
    cuerpo.rotation.x = P.inclX - (libre ? st.mirarY * 0.08 : 0);
    cuerpo.rotation.z = P.inclZ + (st.caminando ? Math.sin(st.fase) * 0.06 : 0);
    brazoI.rotation.set(P.bIx, 0, P.bIz);
    brazoD.rotation.set(P.bDx, 0, P.bDz);

    for (const [ojo_, lado] of [[ojoI, -1], [ojoD, 1]]) {
      ojo_.scale.set(P.ojoS, P.ojoS * P.ojoY * cierre, P.ojoS);
      ojo_.position.copy(enSuperficie(lado * 0.17 + st.mirarX * 0.02 + P.ojoMX, 0.84 + P.ojoMY + st.mirarY * 0.015, 0.02));
    }
    mejillas.forEach((m) => { m.material.opacity = P.mej; });
    bocaSonrisa.visible = o.boca === 'sonrisa';
    bocaTriste.visible = o.boca === 'triste';
    bocaAbierta.visible = o.boca === 'abierta';
    bocaO.visible = o.boca === 'o';
    if (bocaAbierta.visible) {
      const amp = st.hablando ? 0.35 + Math.abs(Math.sin(t * 17) * Math.sin(t * 5.3)) * 0.9 : st.emo === 'canto' ? 0.7 + Math.sin(t * 6) * 0.3 : 0.9;
      bocaAbierta.scale.set(1, 0.7 * amp, 0.35);
    }

    // el lápiz va en la mano derecha
    if (lapiz.visible) {
      brazoD.updateMatrix();
      const mano = new THREE.Vector3(0.04, -0.33, 0.02).applyMatrix4(brazoD.matrix);
      lapiz.position.copy(mano); lapiz.rotation.set(-0.9, 0, -0.5);
    }
    if (avion.visible) {
      brazoD.updateMatrix();
      avion.position.copy(new THREE.Vector3(0.04, -0.36, 0.06).applyMatrix4(brazoD.matrix));
      avion.rotation.set(-0.3, 0.3, 0);
    }

    const pieBaseZ = st.sentado ? 0.36 : 0.05, pieBaseY = st.sentado ? 0.02 : 0.07;
    for (const [p_, lado, desfase] of [[pieI, -1, 0], [pieD, 1, Math.PI]]) {
      const s = Math.sin(st.fase + desfase);
      p_.position.set(lado * 0.2, pieBaseY + (st.caminando ? Math.max(0, s) * 0.1 : 0) + (st.sentado ? Math.sin(t * 2 + desfase) * 0.02 : 0), pieBaseZ + (st.caminando ? s * 0.13 : 0));
    }

    anilloGiro.rotation.y += dt * P.anilloV;
    matAnillo.opacity = P.anilloOp;
    matHalo.opacity = 0.22 * P.anilloOp * (0.8 + Math.sin(t * 2) * 0.2);

    tapaAbierta = lerp(tapaAbierta, tapaObj, 1 - Math.pow(0.01, dt));
    bisagra.rotation.x = -Math.PI / 2 + tapaAbierta * (Math.PI / 2 - 0.3);
    pantalla.material.color.setScalar(0.25 + tapaAbierta * 0.75);

    if (st.dormido && t > st.proxZeta) {
      soltarTexto('z', '#8B7E72', cabeza(1.3).add(new THREE.Vector3(0.3, 0, 0)), new THREE.Vector3(0.15, 0.35, 0), 2.6, 0.26);
      st.proxZeta = t + 1.1;
    }
    if (st.emo === 'canto' && t > st.proxNota) {
      soltarTexto(Math.random() < 0.5 ? '♪' : '♫', '#C98A1C', cabeza(1.2).add(new THREE.Vector3((Math.random() - 0.5) * 0.8, 0, 0.2)), new THREE.Vector3((Math.random() - 0.5) * 0.3, 0.5, 0), 2, 0.3);
      st.proxNota = t + 0.45;
    }
    if (st.emo === 'pensando' && !st.gesto && t > st.proxNota) {
      soltarTexto('…', '#6B6056', cabeza(1.35).add(new THREE.Vector3(0.35, 0, 0)), new THREE.Vector3(0.05, 0.12, 0), 1.2, 0.32);
      st.proxNota = t + 1.2;
    }
    for (let i = particulas.length - 1; i >= 0; i--) {
      const q = particulas[i];
      q.vida -= dt;
      if (q.gravedad) q.vel.y -= q.gravedad * dt;
      q.obj.position.addScaledVector(q.vel, dt);
      q.obj.material.opacity = Math.min(1, Math.max(0, q.vida / q.max) * 1.6);
      if (q.gira) q.obj.material.rotation += q.gira * dt;
      if (q.vida <= 0) { scene.remove(q.obj); q.obj.material.dispose(); particulas.splice(i, 1); }
    }

    const objX = angosto ? Math.max(-1.7, Math.min(SILLON.x, st.x)) : 0.15;
    mira.x = lerp(mira.x, objX, 1 - Math.pow(0.02, dt));
    mira.y = 1.0;
    camera.position.set(mira.x, angosto ? 1.85 : 1.7, angosto ? 7 : 6.6);
    camera.lookAt(mira);

    if (!burbuja.hidden) {
      v3.copy(cabeza(ALTO + 0.25)).project(camera);
      const w = cont.clientWidth, hh = cont.clientHeight;
      burbuja.style.left = Math.max(110, Math.min(w - 110, (v3.x + 1) / 2 * w)) + 'px';
      burbuja.style.top = Math.max(80, (1 - v3.y) / 2 * hh) + 'px';
    }

    renderer.render(scene, camera);
    requestAnimationFrame(cuadro);
  }

  entrada();
  requestAnimationFrame(cuadro);
})();
</script>
