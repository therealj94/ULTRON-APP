<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Aura Orbe</title>
<style>
  :root{
    --bg:#010205; --ink:#eef1f6; --mute:#7d8796; --line:rgba(170,200,255,.12);
    --gold:#e8c98e; --ice:#9fc4ff; --glass:rgba(10,14,22,.62);
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{position:relative;flex:1;min-height:0}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;left:16px;top:max(14px,env(safe-area-inset-top));font:500 10.5px/1.6 var(--mono);
    letter-spacing:.16em;text-transform:uppercase;color:var(--mute);pointer-events:none;user-select:none}
  #hud b{color:var(--gold);font-weight:600}
  #hud .st{color:var(--ink)}
  #cap{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mute);font:13px var(--mono)}
  #nogl i{display:block;width:180px;height:180px;margin:0 auto 18px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#fff8e8 0,#e8c98e 8%,rgba(120,160,255,.35) 32%,rgba(40,60,120,.12) 55%,transparent 70%)}
  .panel{width:min(100%,600px);margin:0 auto;display:grid;gap:10px;padding:12px 16px max(14px,env(safe-area-inset-bottom));z-index:2}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
  input[type=text]:focus{border-color:rgba(232,201,142,.5)}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;cursor:pointer}
  button:hover{border-color:rgba(170,200,255,.3)}
  button.speak{background:linear-gradient(180deg,#f1d7a4,#d9b673);color:#191208;border-color:transparent;font-weight:650;padding:0 18px}
  .states{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .states button{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:9px 10px}
  .states button[aria-pressed=true]{color:var(--ink);border-color:rgba(232,201,142,.6);background:rgba(232,201,142,.08)}
  #mic.on{color:#ffb4a8;border-color:rgba(255,140,120,.6)}
  .lvl{display:flex;align-items:center;gap:10px;font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
  .lvl input{flex:1;accent-color:#d9b673}
  body.clean .panel,body.clean #hud{display:none}
  body.clean.hud #hud{display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="cap" aria-live="polite"></div>
  <div id="nogl"><div><i></i>Este equipo no tiene WebGL.</div></div>
</div>
<div class="panel">
  <form class="row" id="f">
    <input id="t" type="text" maxlength="400" placeholder="Escríbele algo a Aura" autocomplete="off" enterkeyhint="send">
    <button class="speak" type="submit">Hablar</button>
  </form>
  <div class="states">
    <button data-s="idle">Reposo</button>
    <button data-s="listening">Escucha</button>
    <button data-s="thinking">Piensa</button>
    <button data-s="searching">Busca</button>
    <button data-s="speaking">Habla</button>
    <button data-s="done">Listo</button>
    <button id="mic" type="button">Mic</button>
  </div>
  <label class="lvl">Voz <input id="lv" type="range" min="0" max="100" value="0"></label>
</div>
<script>
(() => {
'use strict';
/* =====================================================================================
   AURA · ORBE DE PARTÍCULAS 3D
   - Partículas animadas por completo en la GPU (vertex shader): atributos estáticos + uniformes.
   - Las palabras se forman con partículas del propio orbe (pool), que vuelan en arco 3D y vuelven.
   - HDR + bloom (2 niveles) + tonemap ACES + tramado anti-bandas.
   API: window.AuraFace {setState, say, setLevel, setVoz, listen, silence, state, stats}
        postMessage {type:'aura', state, level, text, dur}
        window.__aura({tipo:'estado'|'boca'|'decir', ...})  (puente de la app)
   ===================================================================================== */
const params = new URLSearchParams(location.search);
// La app (WebView con html propio, sin ?query) pasa sus opciones antes de cargar: window.__orbeOpciones.
const OPC = window.__orbeOpciones || {};
const CLEAN = params.has('clean') || !!OPC.clean;
if (CLEAN) document.body.classList.add('clean');
if (params.has('hud')) document.body.classList.add('hud');
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const cap = document.getElementById('cap');
// «Reducir movimiento»: el del sistema (si la WebView lo pasa), el que manda la app al arrancar o después ({tipo:'movimiento'}).
let REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || OPC.quieto === true;
const COARSE = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
/* ENCUADRE «CENTRO» (la burbuja del botón lateral, José 10-oct: «mira el círculo de asistente»): el lienzo es un cuadro,
   el orbe va ENTERO y centrado (radio = `radio` × lado menor), con su disco azul noche detrás (`disco` × lado menor) y
   transparente alrededor (la burbuja va encima de otra app). Sin palabras de partículas: el texto lo pone la app. */
const CENTRO = OPC.centro && typeof OPC.centro === 'object'
  ? {radio: Math.max(0.1, Math.min(0.45, +OPC.centro.radio || 0.28)), disco: Math.max(0, Math.min(0.5, +OPC.centro.disco || 0))}
  : null;
if (CENTRO){ document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }

/* ---------- contexto ---------- */
const ctxOpts = {alpha:!!CENTRO, antialias:false, depth:false, stencil:false, premultipliedAlpha:!!CENTRO,
  preserveDrawingBuffer:false, powerPreference:'high-performance'};
let gl = params.has('webgl1') ? null : canvas.getContext('webgl2', ctxOpts);
const GL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', ctxOpts) || canvas.getContext('experimental-webgl', ctxOpts);
if (!gl) { document.getElementById('nogl').style.display = 'grid'; exposeStub(); return; }

/* ---------- calidad: escalera según FPS ---------- */
const LADDER = COARSE
  ? [{n:24000,dpr:2},{n:18000,dpr:1.75},{n:13000,dpr:1.5},{n:9500,dpr:1.25}]
  : [{n:64000,dpr:2},{n:48000,dpr:1.75},{n:36000,dpr:1.5},{n:26000,dpr:1.25},{n:18000,dpr:1}];
const NMAX = LADDER[0].n;
const POOL = COARSE ? 9000 : 16000;          // partículas que pueden salir a formar palabras
let qi = Math.min(LADDER.length - 1, Math.max(0, parseInt(params.get('q') || '0', 10) || 0));
const LOCKQ = params.has('q');
const TARGET_FPS = COARSE ? 30 : 60;

/* ---------- shaders (GLSL ES 3.00 / 1.00 con macros) ---------- */
const HDR_V = GL2
  ? '#version 300 es\n#define ATTR in\n#define VOUT out\nprecision highp float;\n'
  : '#define ATTR attribute\n#define VOUT varying\nprecision highp float;\n';
const HDR_F = GL2
  ? '#version 300 es\nprecision highp float;\n#define VIN in\n#define TEX texture\nout vec4 outColor;\n#define FRAG outColor\n'
  : '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n#define VIN varying\n#define TEX texture2D\n#define FRAG gl_FragColor\n';

const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
// Ruido simplex 3D con gradiente analítico (xyz = gradiente, w = valor)
vec4 snoised(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  vec4 m2=m*m;
  vec4 m4=m2*m2;
  vec4 pdotx=vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3));
  vec4 temp=m2*m*pdotx;
  vec3 grad=-8.0*(temp.x*x0+temp.y*x1+temp.z*x2+temp.w*x3);
  grad+=m4.x*p0+m4.y*p1+m4.z*p2+m4.w*p3;
  return 42.0*vec4(grad,dot(m4,pdotx));
}`;

const VS_POINTS = HDR_V + `
ATTR vec4 aP;   // dirección unitaria xyz, radio base
ATTR vec4 aR;   // aleatorios r1 r2 r3, tipo (0 cáscara, 1 núcleo, 2 polvo, 3 anillos)
ATTR vec4 aG;   // palabra: destino x, y local, z, instante de salida
ATTR vec4 aH;   // palabra: instante de regreso, retardo, renglón, tamaño en px
uniform mat4 uVP;
uniform vec3 uCam;
uniform vec3 uFront;
uniform float uTime, uLevel, uSpin, uSwirl, uBand, uScanY, uDoneAge, uBreath, uNoise;
uniform float uPx, uMinPx, uSizeK, uDpr;
uniform vec4 uW0;   // reposo, escucha, piensa, busca
uniform vec2 uW1;   // habla, listo
uniform vec3 uColA, uColB, uColCore, uColText;
uniform float uHist[32];
uniform float uLineY[8];
VOUT vec3 vCol;
VOUT float vSharp;
` + NOISE + `
vec3 rotY(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
vec3 rotAxis(vec3 p,vec3 k,float a){float c=cos(a),s=sin(a);return p*c+cross(k,p)*s+k*dot(k,p)*(1.0-c);}
vec3 bez3(vec3 a,vec3 b,vec3 c,vec3 d,float t){float u=1.0-t;return u*u*u*a+3.0*u*u*t*b+3.0*u*t*t*c+t*t*t*d;}
float easeIO(float t){return t<0.5?4.0*t*t*t:1.0-pow(-2.0*t+2.0,3.0)*0.5;}
float histAt(float th){
  float hi=clamp(th/3.14159,0.0,1.0)*31.0;
  int i0=int(floor(hi));
  int i1=int(min(floor(hi)+1.0,31.0));
  return mix(uHist[i0],uHist[i1],fract(hi));
}
void main(){
  float idle=uW0.x, lis=uW0.y, thk=uW0.z, sea=uW0.w, spk=uW1.x, dne=uW1.y;
  float kind=aR.w;
  vec3 d=aP.xyz; float r0=aP.w;
  float bright=1.0; float wsize=1.0;
  vec3 p;
  if(kind<0.5){
    // cáscara: en «busca» se ordena en paralelos (globo de escaneo)
    float lat=asin(clamp(d.y,-1.0,1.0));
    float stp=3.14159/26.0;
    float q=(floor(lat/stp)+0.5)*stp;
    float lat2=mix(lat,q,sea*0.82);
    vec2 xz=normalize(d.xz+vec2(1e-5,0.0))*cos(lat2);
    d=vec3(xz.x,sin(lat2),xz.y);
    p=d*r0;
  } else if(kind<1.5){
    // núcleo: nube densa que gira despacio
    p=rotAxis(d*r0*(1.0+uLevel*0.55*spk+0.15*sin(uTime*0.9+aR.x*6.28)*idle),normalize(vec3(0.3,1.0,0.2)),uTime*(0.25+aR.y*0.4));
    bright=1.5; wsize=0.8;
  } else if(kind<2.5){
    // polvo exterior: órbitas lentas
    p=rotY(d*r0,uTime*(0.02+aR.x*0.05)*(1.0+thk*3.0));
    bright=0.32+aR.y*0.25; wsize=0.85+aR.z*0.5;
  } else {
    // anillos orbitales (más visibles al pensar)
    float ri=floor(aR.z*3.0);
    vec3 N=ri<0.5?normalize(vec3(0.25,1.0,0.1)):(ri<1.5?normalize(vec3(-0.7,0.55,0.35)):normalize(vec3(0.55,0.35,-0.75)));
    float vis=0.22+thk*0.78+sea*0.25;
    vec3 base=normalize(d-N*dot(d,N));
    float rr=mix(1.0,r0,clamp(vis,0.0,1.0));
    p=rotAxis(base*rr,N,uBand*(1.0+aR.x*0.6)*(ri<1.5?1.0:-1.0));
    bright=(0.25+1.3*thk+0.35*sea)*(0.5+aR.x*0.8)*(0.7+0.6*pow(0.5+0.5*sin(atan(base.z,base.x)*9.0+aR.y*2.0),3.0)); wsize=0.75;
  }
  // giro del orbe y remolino al pensar (torsión acotada)
  p=rotY(p,uSpin+(kind>2.5?0.0:thk*0.55*sin(p.y*2.2+uTime*0.8)));
  // ruido curl (bitangente): movimiento orgánico sin divergencia
  vec3 np=p*1.35+vec3(0.0,uTime*0.11,uTime*0.05);
  vec4 n1=snoised(np);
  vec4 n2=snoised(np+vec3(31.4,17.1,9.7));
  vec3 curl=cross(n1.xyz,n2.xyz);
  float amp=uNoise*(kind>0.5&&kind<1.5?1.8:1.0)*(kind>2.5?0.12:1.0);
  p+=curl*amp*0.0045;
  p*=1.0+n1.w*amp*0.035;
  // ondas desde el polo que mira a la cámara (historial de voz)
  vec3 dn=normalize(p+vec3(1e-5));
  float th=acos(clamp(dot(dn,uFront),-1.0,1.0));
  float h=histAt(th);
  float rip=sin(th*13.0-uTime*7.5);
  float shellK=(kind<0.5)?1.0:((kind>1.5&&kind<2.5)?0.6:0.25);
  float rad=1.0+uBreath
    +shellK*lis*(h*0.21+h*0.07*rip)
    +shellK*spk*(uLevel*0.07+h*0.09+0.012*rip*h);
  // escaneo: plano que barre + meridiano tipo radar
  float scan=exp(-pow((p.y-uScanY)*10.0,2.0));
  float ang=atan(p.z,p.x)-uTime*1.7;
  float mer=pow(0.5+0.5*cos(ang),36.0);
  rad+=sea*scan*0.05*shellK;
  // listo: onda serena que recorre la esfera
  float wave=exp(-pow((th-uDoneAge*1.7)*3.0,2.0))*exp(-uDoneAge*0.55);
  rad+=dne*wave*0.05*shellK;
  p*=rad;
  // brillo por estado
  float arm=pow(0.5+0.5*sin(atan(p.z,p.x)*3.0+p.y*4.5-uSwirl*2.2),6.0);
  float boost=lis*h*(0.6+0.9*abs(rip))*1.4
    +thk*arm*2.2*shellK
    +sea*(scan*3.2+mer*1.1)*shellK
    +spk*uLevel*0.9
    +dne*wave*3.0;
  bright*=1.0+boost;
  if(kind<0.5||kind>2.5){
    vec3 vd=normalize(uCam-p);
    float ndv=abs(dot(normalize(p),vd));
    bright*=0.42+0.95*pow(1.0-ndv,1.6);
  }
  float accent=smoothstep(0.62,0.97,aR.y);
  vec3 col=mix(uColA,uColB,accent);
  if(kind>0.5&&kind<1.5) col=mix(uColCore,uColA,aR.x*0.35);
  col*=bright;
  col=mix(col,vec3(length(col)*0.75),clamp((bright-2.2)*0.18,0.0,0.55)); // las muy brillantes tiran a blanco

  vec3 pos=p; float tx=0.0; float fly=0.0; float gsize=0.0;
  // ===== palabras hechas de partículas =====
  float tIn=aG.w;
  if(tIn>0.0){
    float dIn=aH.y, dOut=aR.z*0.4;
    float pin=clamp((uTime-tIn-dIn)/0.95,0.0,1.0);
    float pout=clamp((uTime-aH.x-dOut)/1.55,0.0,1.0);
    if(pin>0.0&&pout<1.0){
      vec3 tgt=vec3(aG.x,aG.y+uLineY[int(aH.z+0.5)],aG.z);
      vec3 c1=p*1.45+vec3(0.0,0.1,1.1);
      vec3 c2=tgt+vec3((aR.x-0.5)*0.6,0.7,0.6);
      vec3 sw=curl*0.035;
      float e=easeIO(pin);
      vec3 inPos=bez3(p,c1,c2,tgt,e)+sw*sin(3.14159*pin);
      if(pout>0.0){
        float pin0=clamp((aH.x+dOut-tIn-dIn)/0.95,0.0,1.0);
        vec3 start=bez3(p,c1,c2,tgt,easeIO(pin0));
        float eo=easeIO(pout);
        vec3 lift=start+vec3((aR.y-0.5)*0.5,0.55,0.25)+sw*2.0;
        pos=bez3(start,lift,p*1.5+vec3(0.0,0.2,0.7),p,eo)+sw*sin(3.14159*pout);
        tx=(1.0-smoothstep(0.0,0.25,pout))*smoothstep(0.85,1.0,pin0);
        fly=sin(3.14159*pout)*0.6;
      } else {
        pos=inPos;
        tx=smoothstep(0.82,1.0,pin);
        fly=sin(3.14159*pin);
      }
      gsize=aH.w;
    }
  }
  vec4 clip=uVP*vec4(pos,1.0);
  gl_Position=clip;
  float depth=max(clip.w,0.1);
  // tamaño: proyección real + leve desenfoque fuera del plano focal
  float base=0.0105*uSizeK*wsize*(0.75+aR.x*0.5);
  float focal=length(uCam);
  float coc=abs(depth-focal)*0.0022;
  float px=(base+coc)*uPx/depth;
  // profundidad: atrás más tenue
  float front=dot(normalize(pos-vec3(0.0)),normalize(uCam));
  float att=mix(0.10,1.0,smoothstep(-1.0,0.85,front));
  if(kind>0.5&&kind<1.5) att=0.9;
  vec3 c=col*att*(1.0/(1.0+coc*60.0));
  // mezcla hacia el estado «letra»
  if(gsize>0.0){
    float lp=mix(px*1.15,gsize,tx);
    px=mix(lp,lp*1.25,fly*(1.0-tx));
    vec3 tc=uColText*(1.15+0.15*aR.x);
    c=mix(c,tc,tx)+uColText*fly*0.9*(1.0-tx);
  }
  vSharp=tx;
  // tamaño mínimo sin parpadeo: se compensa con la intensidad
  float sz=max(px,uMinPx);
  c*=min(1.0,(px*px)/(sz*sz));
  gl_PointSize=sz;
  vCol=c;
}`;

const FS_POINTS = HDR_F + `
VIN vec3 vCol;
VIN float vSharp;
void main(){
  vec2 q=gl_PointCoord-0.5;
  float r2=dot(q,q)*4.0;
  if(r2>1.0) discard;
  float soft=exp(-r2*4.2);
  float crisp=1.0-smoothstep(0.55,1.0,r2);
  float a=mix(soft,crisp,vSharp);
  FRAG=vec4(vCol*a,1.0);
}`;

const VS_QUAD = HDR_V + `
ATTR vec2 aQ;
VOUT vec2 vUv;
void main(){vUv=aQ*0.5+0.5;gl_Position=vec4(aQ,0.0,1.0);}`;

// reducción + umbral suave
const FS_DOWN = HDR_F + `
VIN vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThresh;
void main(){
  vec3 c=TEX(uTex,vUv+uTexel*vec2(-1.0,-1.0)).rgb+TEX(uTex,vUv+uTexel*vec2(1.0,-1.0)).rgb

VIN vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){

  c+=TEX(uTex,vUv+uDir*1.3846153846).rgb*0.3162162162;
  c+=TEX(uTex,vUv-uDir*1.3846153846).rgb*0.3162162162;
  c+=TEX(uTex,vUv+uDir*3.2307692308).rgb*0.0702702703;

const FS_COMP = HDR_F + `
VIN vec2 vUv;
uniform sampler2D uScene, uB1, uB2;
uniform vec2 uRes;
uniform vec2 uCenter;      // centro del orbe en px de pantalla
uniform float uRadius;     // radio en px
uniform vec3 uGlowCol;
uniform float uGlow, uB1k, uB2k, uExpo, uTime;
uniform float uCentro, uDisco;   // encuadre «centro»: 1 = transparente alrededor; radio del disco de fondo en px
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}

void main(){
  vec2 fc=vUv*uRes;

  c+=TEX(uB1,vUv).rgb*uB1k+TEX(uB2,vUv).rgb*uB2k;
  float d=length(fc-uCenter)/uRadius;

    // La burbuja: sin fondo propio. El orbe y su halo, un disco azul noche detrás (más claro al centro, borde suave) y
    // una sombra tenue alrededor que lo separa de cualquier app; nada se corta contra el borde cuadrado del lienzo.
    c+=uGlowCol*(uGlow*exp(-d*d*28.0)*1.6+uGlow*0.30*exp(-d*d*3.2));
    vec3 m=pow(aces(c*uExpo),vec3(1.0/2.2));

    float borde=min(uRes.x,uRes.y)*0.5;

    float disco=uDisco>0.0?1.0-smoothstep(uDisco*0.965,uDisco*1.012,rr):0.0;
    float sombra=uDisco>0.0?(1.0-smoothstep(uDisco,min(borde,uDisco*1.22),rr))*0.32:0.0;

    float lm=max(m.r,max(m.g,m.b));

  vec3 bg=vec3(0.0015,0.0025,0.005)+vec3(0.004,0.007,0.016)*exp(-d*d*0.25);

  vec3 glow=uGlowCol*(uGlow*exp(-d*d*28.0)*1.6+uGlow*0.30*exp(-d*d*3.2)+0.012*exp(-d*1.2));

  FRAG=vec4(m,1.0);

// Tipos: 0 cáscara (Fibonacci), 1 núcleo, 2 polvo, 3 anillos. El pool de palabras va primero (cáscara).
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

(function build(){
  // el resto se mezcla para que cualquier prefijo (calidad menor) mantenga la proporción
  const kinds = [];
  const rest = NMAX - POOL;
  const nCore = Math.round(NMAX*0.06), nDust = Math.round(NMAX*0.07), nBand = Math.round(NMAX*0.07);
  const nShellRest = rest - nCore - nDust - nBand;
  for (let i=0;i<nShellRest;i++) kinds.push(0);
  for (let i=0;i<nCore;i++) kinds.push(1);
  for (let i=0;i<nDust;i++) kinds.push(2);
  for (let i=0;i<nBand;i++) kinds.push(3);
  for (let i=kinds.length-1;i>0;i--){ const j = (rand()*(i+1))|0; const t = kinds[i]; kinds[i] = kinds[j]; kinds[j] = t; }
  const order = new Array(POOL).fill(0).concat(kinds);

  const nShell = POOL + nShellRest;
  const fib = new Uint32Array(nShell); for (let i=0;i<nShell;i++) fib[i]=i;
  for (let i=nShell-1;i>0;i--){ const j=(rand()*(i+1))|0; const t=fib[i]; fib[i]=fib[j]; fib[j]=t; }
  const ga = Math.PI*(3-Math.sqrt(5)); let aR_ring = 0;

const MARGEN = {arriba: Math.max(0, +(OPC.margen && OPC.margen.arriba) || 0), abajo: Math.max(0, +(OPC.margen && OPC.margen.abajo) || 0)};

  const arriba = Math.min(MARGEN.arriba, CH*0.3), abajo = Math.min(MARGEN.abajo, CH*0.45);
  const UH = Math.max(CH*0.3, CH - arriba - abajo);
  cam.orbYFrac = (arriba + UH*(portrait ? 0.36 : 0.385)) / CH;
  cam.rPx = Math.min(UH*(portrait?0.215:0.255), CW*0.335);
  if (CENTRO){ cam.orbYFrac = 0.5; cam.rPx = Math.min(CW, CH)*CENTRO.radio; }

  cam.energia = CENTRO ? Math.max(0.35, Math.min(1, cam.rPx/140)) : 1;

  get stats(){ return {webgl: GL2 ? 2 : 1, hdr: !!HDR, particles: LADDER[qi].n, pool: POOL, dpr: DPR, fps: Math.round(fpsShown), quality: qi}; },
};

/* ---------- interacción (parallax) ---------- */
let pX = 0, pY = 0, pXs = 0, pYs = 0;
addEventListener('pointermove', e => { pX = (e.clientX/innerWidth - 0.5)*2; pY = (e.clientY/innerHeight - 0.5)*2; }, {passive:true});
addEventListener('pointerleave', () => { pX = pY = 0; });
// Tocar el orbe: una onda de luz y una gota de sonido; deslizar arriba/abajo, como en la sala de antes.
let tapAt = -99, toque0 = null;
addEventListener('pointerdown', e => { toque0 = {x: e.clientX, y: e.clientY, t: performance.now()}; }, {passive:true});
addEventListener('pointerup', e => {
  if (!toque0 || e.target.closest && e.target.closest('.panel,#hud,button,input,form')) { toque0 = null; return; }
  const dx = e.clientX - toque0.x, dy = e.clientY - toque0.y, dt = performance.now() - toque0.t; toque0 = null;
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)*1.5 && dt < 700){ notify({tipo:'deslizar', dir: dy < 0 ? 'arriba' : 'abajo'}); return; }
  if (Math.hypot(dx, dy) < 14 && dt < 450){ tapAt = clock; SFX.toque(); notify({tipo:'tocar', zona:'cuerpo'}); }
}, {passive:true});

/* ---------- bucle ---------- */
let last = 0, running = true, fpsAcc = 0, fpsFrames = 0, fpsShown = 0, slowWin = 0, goodWin = 0, upgraded = false, settle = 0;
function frame(now){
  if (!running) return;
  requestAnimationFrame(frame);
  let dt = last ? (now - last)/1000 : 1/60; last = now;
  if (dt > 0.25) dt = 0.25;   // todo es función del tiempo: un equipo lento no se queda atrás
  clock += dt;
  // FPS y escalera de calidad
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 1.5){
    fpsShown = fpsFrames/fpsAcc; fpsAcc = 0; fpsFrames = 0;
    if (!LOCKQ && settle-- <= 0){
      if (fpsShown < TARGET_FPS*0.82 && qi < LADDER.length-1){ if (++slowWin >= 2){ qi++; slowWin = 0; settle = 2; resize(); } }
      else slowWin = 0;
      if (fpsShown > TARGET_FPS*0.97 && qi > 0 && !upgraded){ if (++goodWin >= 4){ qi--; goodWin = 0; upgraded = true; settle = 2; resize(); } }
      else goodWin = 0;
    }
    if (!CLEAN || document.body.classList.contains('hud')) drawHud();
  }
  // pesos de estado (transición suave ~0.6 s)
  const kw = 1 - Math.exp(-dt*4.2);
  STATES.forEach(s => wgt[s] += ((s === state ? 1 : 0) - wgt[s])*kw);
  // nivel de voz
  if (analyser){
    analyser.getByteFrequencyData(freq);
    let s = 0; for (let i=2;i<40;i++) s += freq[i];
    micLevel += (Math.min(1, s/38/140) - micLevel)*0.45;
  } else micLevel *= 0.9;
  stepSpeech(dt);
  updateLines(dt);
  const extLive = clock - extAt < 0.6;
  const raw = Math.max(extLive ? extLevel : 0, micLevel, speech && !speech.ended && !extLive ? synthLevel : 0);
  level += (raw - level)*(raw > level ? 1 - Math.exp(-dt*28) : 1 - Math.exp(-dt*9));
  histAcc += dt;
  while (histAcc > 1/30){ histAcc -= 1/30; hist.copyWithin(1, 0, 31); hist[0] = level; }
  // la expresión: entra rápido (~0,4 s), sale despacio (~1 s) y vence sola
  if (EXPR.hasta >= 0 && clock > EXPR.hasta){ EXPR.meta = 0; EXPR.hasta = -1; }
  EXPR.w += (EXPR.meta - EXPR.w)*(1 - Math.exp(-dt*(EXPR.meta > EXPR.w ? 3.2 : 1.3)));
  const E = EXPR.p, ew = E ? EXPR.w : 0;
  const W_ = wgt, mv = REDUCED ? 0.35 : 1;
  spin += dt*(0.06 + W_.thinking*0.55 + W_.searching*0.12 + W_.speaking*0.04 + (E ? E.giro*ew : 0))*mv;
  swirl += dt*(W_.thinking*1.0 + (E ? E.piensa*ew : 0))*mv;
  band += dt*(0.12 + W_.thinking*1.1 + W_.searching*0.3)*mv;
  render();
  if (!pintado){ pintado = true; notify({tipo:'pintado'}); }
}
let pintado = false;
function drawHud(){
  const st = {idle:'reposo', listening:'escucha', thinking:'piensa', searching:'busca', speaking:'habla', done:'listo'}[state];
  hud.innerHTML = `<b>AURA</b> · <span class="st">${st}</span><br>WebGL${GL2?2:1}${HDR?' · HDR':''} · ${(LADDER[qi].n/1000).toFixed(0)}k part. · ${Math.round(fpsShown)} fps`;
}
function mix3(key){
  const o = [0,0,0]; let sum = 0;
  STATES.forEach(s => { const w = wgt[s]; sum += w; const c = PAL[s][key]; o[0]+=c[0]*w; o[1]+=c[1]*w; o[2]+=c[2]*w; });
  return o.map(v => v/Math.max(1e-4, sum));
}
function mix1(key){ let o = 0, sum = 0; STATES.forEach(s => { o += PAL[s][key]*wgt[s]; sum += wgt[s]; }); return o/Math.max(1e-4, sum); }

function render(){
  const t = clock, mv = REDUCED ? 0.3 : 1;
  // cámara: órbita lenta + parallax del puntero; menos amplitud cuando hay texto
  const textOn = speech && !speech.dissolved ? 1 : 0;
  pXs += (pX - pXs)*0.04; pYs += (pY - pYs)*0.04;
  const amp = (textOn ? 0.45 : 1)*mv;
  const yaw = (Math.sin(t*0.071)*0.13 + Math.sin(t*0.031)*0.06 + pXs*0.09)*amp;
  const pitch = (Math.sin(t*0.053)*0.05 + pYs*0.05)*amp;
  let eye = [0, cam.y, cam.D], tgt = [0, cam.y, 0];
  eye = rotYv(rotXv(eye, -pitch), yaw); tgt = rotYv(rotXv(tgt, -pitch), yaw);
  const view = lookAt(eye, tgt, [0,1,0]);
  const proj = mat4Persp(FOV, W/H, 0.1, 50);
  const vp = mul(proj, view);
  const camLen = Math.hypot(eye[0], eye[1], eye[2]);
  const front = [eye[0]/camLen, eye[1]/camLen, eye[2]/camLen];
  // centro del orbe en pantalla
  const cc = [vp[12], vp[13], vp[15]];
  const cx = (cc[0]/cc[2]*0.5+0.5)*W, cy = (cc[1]/cc[2]*0.5+0.5)*H;
  const W_ = wgt;
  const E = EXPR.p, ew = E ? EXPR.w : 0;
  let breath = (Math.sin(t*0.85)*0.028*W_.idle + Math.sin(t*1.1)*0.01) * mv;
  let glowK = 1, noiseK = 1, latido = 0;
  if (ew > 0.001){
    // respiración propia, tamaño (sorpresa crece, preocupación se recoge), el golpe del inicio y el latido del núcleo
    const pa = t - EXPR.desde;
    breath += ew*(E.respiro[0]*Math.sin(t*E.respiro[1]*6.2832)*mv + E.radio)
      + E.pulso*Math.exp(-pa*3.5)*(1 - Math.exp(-pa*18))*mv;
    latido = ew*E.latido[0]*Math.pow(0.5 + 0.5*Math.sin(t*E.latido[1]*6.2832), 4)*(REDUCED ? 0.4 : 1);
    glowK = 1 + (E.brillo - 1)*ew;
    noiseK = 1 + (E.ruido - 1)*ew;
  }
  const scanY = Math.sin(t*1.25)*0.92;
  const doneAge = Math.max(0, t - doneAt);
  let colA = mix3('A'), colB = mix3('B'), colC = mix3('C');
  if (ew > 0.001){
    const lerp = (a, b) => a.map((v, i) => v + (b[i] - v)*ew);
    colA = lerp(colA, E.A); colB = lerp(colB, E.B); colC = lerp(colC, E.C);
  }

  // ---- partículas → escena HDR
  gl.bindFramebuffer(gl.FRAMEBUFFER, tScene.fb); gl.viewport(0, 0, W, H);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P_PTS.p); usePoints();
  const u = P_PTS.u;
  gl.uniformMatrix4fv(u.uVP, false, vp);
  gl.uniform3fv(u.uCam, eye); gl.uniform3fv(u.uFront, front);
  gl.uniform1f(u.uTime, t); gl.uniform1f(u.uLevel, level);
  gl.uniform1f(u.uSpin, spin); gl.uniform1f(u.uSwirl, swirl); gl.uniform1f(u.uBand, band);
  gl.uniform1f(u.uScanY, scanY); gl.uniform1f(u.uDoneAge, doneAge); gl.uniform1f(u.uBreath, breath);
  gl.uniform1f(u.uNoise, mix1('noise')*noiseK*mv);
  gl.uniform1f(u.uPx, H/(2*TANF)); gl.uniform1f(u.uMinPx, 1.35*Math.max(1, DPR*0.85)); gl.uniform1f(u.uDpr, DPR);
  // con menos partículas, puntos un poco más grandes para mantener la densidad visual
  gl.uniform1f(u.uSizeK, Math.sqrt(NMAX/LADDER[qi].n)*(COARSE?1.05:1.0));
  gl.uniform4f(u.uW0, W_.idle, W_.listening, Math.min(1, W_.thinking + (E ? E.piensa*ew : 0)), Math.min(1, W_.searching + (E ? E.busca*ew : 0)));
  gl.uniform2f(u.uW1, W_.speaking, Math.min(1, W_.done + (E ? E.listo*ew : 0)));
  const I = INTENSITY*(0.62*Math.sqrt(36000/LADDER[qi].n))*cam.energia;
  gl.uniform3f(u.uColA, colA[0]*I, colA[1]*I, colA[2]*I);
  gl.uniform3f(u.uColB, colB[0]*I, colB[1]*I, colB[2]*I);
  gl.uniform3f(u.uColCore, colC[0]*I, colC[1]*I, colC[2]*I);
  const ti = INTENSITY*0.78;
  gl.uniform3f(u.uColText, TEXT_COL[0]*ti, TEXT_COL[1]*ti, TEXT_COL[2]*ti);
  gl.uniform1fv(u.uHist, hist);
  gl.uniform1fv(u.uLineY, lineY);
  gl.drawArrays(gl.POINTS, 0, LADDER[qi].n);
  gl.disable(gl.BLEND);

  // ---- bloom
  useQuad();
  gl.useProgram(P_DOWN.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, tB1.fb); gl.viewport(0, 0, tB1.w, tB1.h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tScene.tex);
  gl.uniform1i(P_DOWN.u.uTex, 0); gl.uniform2f(P_DOWN.u.uTexel, 1/W*1.0, 1/H*1.0); gl.uniform1f(P_DOWN.u.uThresh, HDR ? 0.75 : 0.5);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  blur(tB1, tB1b, 1.0);
  gl.useProgram(P_DOWN.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, tB2.fb); gl.viewport(0, 0, tB2.w, tB2.h);
  gl.bindTexture(gl.TEXTURE_2D, tB1.tex); gl.uniform2f(P_DOWN.u.uTexel, 0.5/tB1.w, 0.5/tB1.h); gl.uniform1f(P_DOWN.u.uThresh, 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  blur(tB2, tB2b, 1.0); blur(tB2, tB2b, 2.0);

  // ---- composición
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P_COMP.p); const c = P_COMP.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tScene.tex); gl.uniform1i(c.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tB1.tex); gl.uniform1i(c.uB1, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tB2.tex); gl.uniform1i(c.uB2, 2);
  gl.uniform2f(c.uRes, W, H); gl.uniform2f(c.uCenter, cx, cy); gl.uniform1f(c.uRadius, cam.rPx*DPR);
  gl.uniform3fv(c.uGlowCol, colC);
  const flash = W_.done*Math.exp(-doneAge*1.6)*0.9 + Math.exp(-Math.max(0, clock - tapAt)*4)*0.45;
  gl.uniform1f(c.uGlow, mix1('glow')*glowK*(1 + level*0.9*W_.speaking + level*0.5*W_.listening) + flash + latido);
  gl.uniform1f(c.uCentro, CENTRO ? 1 : 0); gl.uniform1f(c.uDisco, CENTRO ? Math.min(W, H)*CENTRO.disco : 0);
  gl.uniform1f(c.uB1k, 0.42); gl.uniform1f(c.uB2k, 0.28); gl.uniform1f(c.uExpo, 1.0); gl.uniform1f(c.uTime, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}
function blur(a, b, spread){
  gl.useProgram(P_BLUR.p); gl.uniform1i(P_BLUR.u.uTex, 0); gl.activeTexture(gl.TEXTURE0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, b.fb); gl.viewport(0, 0, b.w, b.h);
  gl.bindTexture(gl.TEXTURE_2D, a.tex); gl.uniform2f(P_BLUR.u.uDir, spread/a.w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, a.fb); gl.viewport(0, 0, a.w, a.h);
  gl.bindTexture(gl.TEXTURE_2D, b.tex); gl.uniform2f(P_BLUR.u.uDir, 0, spread/b.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- ciclo de vida ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; }
  else if (!running){ running = true; last = 0; requestAnimationFrame(frame); }
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; notify({type:'aura-fallo', motivo:'contexto WebGL perdido'}); });
canvas.addEventListener('webglcontextrestored', () => location.reload());
let rzT = 0; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 60); });
resize();
setState(state);
requestAnimationFrame(frame);

/* ---------- panel de prueba ---------- */
document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('t').value.trim(); if (v) say(v); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { if (b.dataset.s !== 'speaking') silence(); setState(b.dataset.s); });
document.getElementById('mic').onclick = async () => { try { await listen(); } catch { document.getElementById('mic').textContent = 'Sin mic'; } };
const lv = document.getElementById('lv');
lv.oninput = () => setLevel(lv.value/100);
let lvT = 0; lv.onpointerdown = () => { clearInterval(lvT); lvT = setInterval(() => setLevel(lv.value/100), 100); };
lv.onpointerup = () => { clearInterval(lvT); };
notify({type:'aura-listo', webgl: GL2 ? 2 : 1});
notify({tipo:'listo'});
if (params.get('say')) setTimeout(() => say(params.get('say')), 600);
else if (!CLEAN && !params.has('silent') && !params.has('state')) setTimeout(() => say('Hola, soy Aura. Estoy lista para ayudarte.'), 900);

function exposeStub(){
  window.AuraFace = {setState(){}, say(){}, silence(){}, listen(){}, setLevel(){}, setVoz(){}, state:'idle', stats:{webgl:0}};
  try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({tipo:'fallo', motivo:'sin WebGL'})); } catch {}
}
})();
</script>
</body>
</html>
