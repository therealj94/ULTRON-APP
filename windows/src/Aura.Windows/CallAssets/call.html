<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'self'; img-src 'self' data:"><link rel="stylesheet" href="call.css"><title>AURA · Llamada</title></head><body>
<header><strong>AURA / CONVERSACIÓN</strong><span id="status" role="status">Crea una llamada o introduce una invitación.</span></header>
<main><section class="stage"><video id="remote" autoplay playsinline></video><div class="placeholder" id="placeholder">La otra persona aparecerá aquí.</div><video id="local" autoplay playsinline muted></video></section>
<nav><button id="audio">Activar audio</button><button id="video">Activar audio y cámara</button><button id="mic" disabled>Silenciar</button><button id="camera" disabled>Apagar cámara</button><button id="play">Reproducir audio remoto</button><button id="hangup" class="danger">Colgar</button></nav>
<p>Micrófono y cámara se activan solo cuando los eliges. La invitación permite entrar a una persona. Compartir pantalla no está habilitado.</p>
<section class="chat"><div id="messages" aria-live="polite"></div><form id="form"><input id="text" maxlength="4000" placeholder="Mensaje para la otra persona" aria-label="Mensaje"><button id="send" disabled>Enviar</button></form></section></main><script src="call.js"></script></body></html>
