name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**", "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Dos aplicaciones del mismo proyecto. Una matriz y no dos ficheros: así no se desincronizan,
    # que es lo que pasa siempre con dos flujos copiados. Cada variante corre en su propio runner
    # con su propio checkout, de modo que el `android/` que genera una no toca el de la otra.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: ultron
            marca: ULTRON-FP
            titulo: ULTRON FP
          - variante: electrum
            marca: DR-ELECTRUM-FP
            titulo: Dr Electrum FP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Prebuild Android
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        env:
          ULTRON_APP: ${{ matrix.variante }}
        # `--clean` solo en la variante del doctor: cambia el nombre de paquete, y sobre un
        # `android/` ya generado para `link.ordenglobal.ultronfp` el prebuild no lo reescribe
        # entero. ULTRON se queda sin `--clean` para no perder nada de su nativo ya probado.
        run: |
          if [ "${{ matrix.variante }}" = "electrum" ]; then
            npx expo prebuild -p android --no-install --clean
          else
            npx expo prebuild -p android --no-install
          fi

      # Release = JS empaquetado + Hermes. Firmado con la keystore debug del template
      # para instalar directo; para Play Store se cambia la firma.
      - name: Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ matrix.marca }}-${VERSION}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.marca }}-apk
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # En main, el APK se publica como Release para tener un enlace de descarga directo y permanente:
      #   https://github.com/<owner>/<repo>/releases/latest/download/ULTRON-FP-<version>.apk
      - name: Publicar Release (solo main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ULTRON FP ${{ steps.version.outputs.version }}
          body: |
            APKs compilados por GitHub Actions desde `${{ github.sha }}`.
            ULTRON FP es la mesa de la junta; Dr Electrum FP es la estación minera. Son paquetes
            distintos, así que se pueden instalar las dos a la vez sin que una desinstale a la otra.
            Instalación: abrir el .apk en el teléfono y permitir «instalar apps desconocidas». Si había una versión de EAS, desinstalarla primero (firma distinta).
          files: mobile/out/*.apk
          make_latest: true
