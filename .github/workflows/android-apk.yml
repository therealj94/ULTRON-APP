name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**", "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Dos aplicaciones del mismo proyecto. Una matriz y no dos ficheros: así no se desincronizan,
    # que es lo que pasa siempre con dos flujos copiados. Cada variante corre en su propio runner
    # con su propio checkout, de modo que el `android/` que genera una no toca el de la otra.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: ultron
            marca: ULTRON-FP
            titulo: ULTRON FP
          - variante: electrum
            marca: DR-ELECTRUM-FP
            titulo: Dr Electrum FP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Prebuild Android
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          ULTRON_APP: ${{ matrix.variante }}
        # Sin `--clean` y sin condicionales: `mobile/android` está en .gitignore, así que en un
        # checkout limpio no existe y el prebuild lo genera entero de cero para la variante que
        # toque. Llegué a escribir aquí una rama con `--clean` «porque el android ya generado no
        # cambia de paquete» — cierto en local, falso en CI, y una condición con una explicación
        # equivocada es peor que ninguna condición.
        run: npx expo prebuild -p android --no-install

      # Release = JS empaquetado + Hermes. Firmado con la keystore debug del template
      # para instalar directo; para Play Store se cambia la firma.
      - name: Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ matrix.marca }}-${VERSION}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.marca }}-apk
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: 30

  # El Release va aparte, después de las dos. Dentro de la matriz, en main los dos trabajos
  # intentaban crear la MISMA etiqueta a la vez; aquí se juntan los dos APK y se publica una sola
  # vez, que además es lo que quiere quien descarga: las dos apps en el mismo sitio.
  publicar:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Ver qué llegó
        run: ls -la apks

      # Enlace de descarga directo y permanente:
      #   https://github.com/<owner>/<repo>/releases/latest/download/ULTRON-FP-<version>.apk
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          name: ULTRON FP y Dr Electrum FP ${{ needs.apk.outputs.version }}
          body: |
            APKs compilados por GitHub Actions desde `${{ github.sha }}`.

            **ULTRON FP** es la mesa de la junta. **Dr Electrum FP** es la estación minera. Son
            paquetes distintos, así que se pueden instalar las dos a la vez sin que una desinstale
            a la otra.

            Instalación: abrir el .apk en el teléfono y permitir «instalar apps desconocidas». Si
            había una versión de EAS, desinstalarla primero (firma distinta).
          files: apks/*.apk
          make_latest: true
