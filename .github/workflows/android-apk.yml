name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**", "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/calidad-movil.yml"
      # Lo que decide cómo sale la APK (firma, huella, comprobación por dentro).
      - "scripts/qa/firma-release.mjs"
      - "scripts/qa/comprobar-apk.mjs"
      - "scripts/qa/runtime-android.mjs"
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Las pruebas funcionales ANTES de compilar: una APK no sale de un commit que rompe una prueba.
  calidad:
    uses: ./.github/workflows/calidad-movil.yml

  apk:
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A nivel de TRABAJO, no de paso. `expo-constants` instala una tarea de Gradle que REGENERA
    # `assets/app.config` en cada compilación, o sea que `app.config.js` se evalúa DOS veces: una
    # en el prebuild y otra dentro de `assembleRelease`. Con la variable solo en el prebuild, la
    # APK del doctor salía con el paquete, el icono y el nombre correctos —y con la configuración
    # de AU-RA dentro—, así que al abrirla arrancaba la mesa de la junta. Compilaba, instalaba y
    # estaba mal, que es la peor forma de estar mal.
    env:
      ULTRON_APP: ${{ matrix.variante }}
      # También a nivel de trabajo, por lo mismo: Gradle vuelve a evaluar app.config.js y ahí calcula
      # la huella (runtimeVersion) que queda dentro de la APK. Solo las APK de main escuchan las
      # actualizaciones de producción; las de ramas, `pruebas` (ver CANAL en app.config.js).
      EXPO_CANAL: ${{ github.ref == 'refs/heads/main' && 'production' || 'pruebas' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Dos aplicaciones del mismo proyecto. Una matriz y no dos ficheros: así no se desincronizan,
    # que es lo que pasa siempre con dos flujos copiados. Cada variante corre en su propio runner
    # con su propio checkout, de modo que el `android/` que genera una no toca el de la otra.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: ultron
            marca: AU-RA-FP
            titulo: AU-RA FP
          - variante: electrum
            marca: DR-ELECTRUM-FP
            titulo: Dr Electrum FP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      # La huella nativa ANTES del prebuild: es la que calculará `eas update` al publicar (que no
      # hace prebuild). Después se compara con la que Gradle metió en la APK. Solo AU-RA recibe
      # actualizaciones por aire (Dr Electrum las tiene apagadas hasta tener su proyecto EAS).
      - name: Runtime (huella nativa)
        id: runtime
        if: matrix.variante == 'ultron'
        working-directory: mobile
        run: echo "runtime=$(node ../scripts/qa/runtime-android.mjs)" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        # Sin `--clean` y sin condicionales: `mobile/android` está en .gitignore, así que en un
        # checkout limpio no existe y el prebuild lo genera entero de cero para la variante que
        # toque. Llegué a escribir aquí una rama con `--clean` «porque el android ya generado no
        # cambia de paquete» — cierto en local, falso en CI, y una condición con una explicación
        # equivocada es peor que ninguna condición.
        run: npx expo prebuild -p android --no-install

      # FIRMA PROPIA. El App Link de AU-RA (/.well-known/assetlinks.json del servidor) solo se
      # verifica si la APK va firmada con una llave nuestra: la keystore debug del template es la
      # misma en todos los proyectos y su huella es pública. Con ANDROID_KEYSTORE_BASE64 y
      # ANDROID_KEYSTORE_PASSWORD (PKCS12; alias ANDROID_KEY_ALIAS, por omisión «aura»; clave de la
      # llave ANDROID_KEY_PASSWORD, por omisión la del almacén) el release se firma con ella.
      #
      # Sin ellos: en MAIN (producción) el flujo FALLA —una APK de producción firmada con la llave
      # pública del template no es una identidad segura ni actualiza las instaladas—; en una rama
      # (canal `pruebas`) se firma con la debug, avisando.
      #
      # La keystore se decodifica en RUNNER_TEMP (fuera del repo, 0600) y se borra al terminar. Las
      # claves no se escriben en ningún archivo ni en la línea de comandos: el build.gradle que
      # parchea scripts/qa/firma-release.mjs las lee del entorno cuando compila.
      - name: Firma del release
        id: firma
        working-directory: mobile
        env:
          FIRMA_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AURA_FIRMA_CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURA_FIRMA_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'aura' }}
        run: |
          if [ -z "$FIRMA_KEYSTORE_B64" ] || [ -z "$AURA_FIRMA_CLAVE" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Sin ANDROID_KEYSTORE_BASE64 o ANDROID_KEYSTORE_PASSWORD no se compila la APK de producción: no se firma con la keystore debug del template."
              exit 1
            fi
            echo "::warning::Rama de pruebas sin keystore propia: el release se firma con la keystore debug del template (solo canal pruebas)."
            echo "firma=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIR="$RUNNER_TEMP/firma-apk"
          mkdir -p "$DIR"
          chmod 700 "$DIR"
          ARCHIVO="$DIR/release.keystore"
          (umask 077 && printf '%s' "$FIRMA_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$ARCHIVO")
          # Que abra con esa clave y tenga ese alias ANTES de gastar veinte minutos compilando.
          if ! keytool -list -keystore "$ARCHIVO" -storepass:env AURA_FIRMA_CLAVE -alias "$AURA_FIRMA_ALIAS" > /dev/null 2>&1; then
            rm -f "$ARCHIVO"
            echo "::error::La keystore de ANDROID_KEYSTORE_BASE64 no abre con ANDROID_KEYSTORE_PASSWORD o no tiene el alias (ANDROID_KEY_ALIAS, por omisión «aura»)."
            exit 1
          fi
          node ../scripts/qa/firma-release.mjs android/app/build.gradle
          echo "AURA_FIRMA_ARCHIVO=$ARCHIVO" >> "$GITHUB_ENV"
          echo "firma=propia" >> "$GITHUB_OUTPUT"

      # Release = JS empaquetado + Hermes. Firmado con la keystore propia si el paso anterior la
      # preparó; si no, con la keystore debug del template (para instalar directo).
      - name: Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          # Las lee el bloque de firma que inyecta firma-release.mjs (sin él, no las usa nadie).
          AURA_FIRMA_CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURA_FIRMA_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'aura' }}
          AURA_FIRMA_CLAVE_LLAVE: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          # La huella que va dentro de la APK es la de ANTES de compilar: la misma que calcula
          # `eas update` al publicar (que no compila). Si Gradle la recalcula por su cuenta, lo hace
          # con lo que la compilación ya escribió y sale otra, y ninguna actualización le llegaría
          # (pasó en la primera APK con OTA). Vacío en Dr Electrum: no tiene OTA.
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.runtime.outputs.runtime }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Borrar la keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/firma-apk"

      - name: Rename APK
        id: version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ matrix.marca }}-${VERSION}.apk"
          ls -la out

      # La huella SHA-256 del certificado con que QUEDÓ firmado el APK, leída del APK con apksigner
      # (no supuesta). En la forma «AB:CD:…» que va tal cual en ANDROID_CERT_SHA256 del servidor.
      - name: Huella del certificado
        working-directory: mobile
        env:
          HUELLA_AUTORIZADA: ${{ vars.ANDROID_CERT_SHA256_AUTORIZADA || '3A:2E:DC:D5:23:2C:F0:6F:2F:8E:96:AE:F6:FC:40:D0:1D:61:5A:E2:4C:8E:59:66:BA:A1:03:83:51:55:70:5F' }}
        run: |
          APK="out/${{ matrix.marca }}-${{ steps.version.outputs.version }}.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          # apksigner escribe «Signer #1 certificate SHA-256 digest: …», «V2 Signer: certificate…» o, según
          # las versiones y el minSdk, «Signer (minSdkVersion=…) certificate…»: vale cualquiera.
          SALIDA=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          HUELLA=$(printf '%s\n' "$SALIDA" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | head -n 1 | tr -d ' ' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -z "$HUELLA" ]; then printf '%s\n' "$SALIDA" | head -n 20; fi
          if [ -z "$HUELLA" ]; then
            echo "::error::apksigner no devolvió la huella SHA-256 del APK."
            exit 1
          fi
          echo "SHA-256 del certificado (${{ matrix.variante }}, firma ${{ steps.firma.outputs.firma }}): $HUELLA"
          echo "SHA-256 del certificado de ${{ matrix.titulo }} (firma ${{ steps.firma.outputs.firma }}): \`$HUELLA\`" >> "$GITHUB_STEP_SUMMARY"
          # En main, la huella tiene que ser la AUTORIZADA (la de la llave con que se publicaron las APK
          # instaladas y la que declara assetlinks). Otra huella no actualizaría las instaladas.
          # La variable del repositorio ANDROID_CERT_SHA256_AUTORIZADA la cambia sin tocar el flujo.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$HUELLA" != "$HUELLA_AUTORIZADA" ]; then
            echo "::error::La APK quedó firmada con $HUELLA y la autorizada es $HUELLA_AUTORIZADA. No se publica."
            exit 1
          fi

      # Comprobar el APK por dentro, no confiar en que salió bien.
      #
      # Un APK que compila puede llevar la configuración de la otra app: pasó exactamente eso, y
      # ni el typecheck ni Gradle ni el tamaño del fichero lo delataron. Esto lo abre y mira.
      - name: Comprobar el APK
        working-directory: mobile
        run: node ../scripts/qa/comprobar-apk.mjs "out/${{ matrix.marca }}-${{ steps.version.outputs.version }}.apk" "${{ matrix.variante }}"

      # La huella que la APK anunciará al pedir actualizaciones, leída de la APK y no supuesta. Si no
      # coincide con la de antes del prebuild, ninguna actualización publicada le llegaría nunca.
      # Se guarda junto al APK: el flujo de OTA la usa para saber si hay APK que pueda recibir.
      - name: Runtime de la APK
        if: matrix.variante == 'ultron'
        working-directory: mobile
        run: |
          APK="out/${{ matrix.marca }}-${{ steps.version.outputs.version }}.apk"
          EN_APK=$(unzip -p "$APK" assets/fingerprint)
          if [ "$EN_APK" != "${{ steps.runtime.outputs.runtime }}" ]; then
            echo "::error::La APK trae la huella «$EN_APK» y el proyecto da «${{ steps.runtime.outputs.runtime }}». Ninguna OTA le llegaría."
            exit 1
          fi
          echo "$EN_APK" > "out/runtime-${{ matrix.variante }}.txt"
          echo "runtime ${{ matrix.variante }} ($EXPO_CANAL): $EN_APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.marca }}-apk
          path: |
            mobile/out/*.apk
            mobile/out/runtime-*.txt
          if-no-files-found: error
          retention-days: 30

  # El Release va aparte, después de las dos. Dentro de la matriz, en main los dos trabajos
  # intentaban crear la MISMA etiqueta a la vez; aquí se juntan los dos APK y se publica una sola
  # vez, que además es lo que quiere quien descarga: las dos apps en el mismo sitio.
  publicar:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Ver qué llegó
        run: ls -la apks

      # Enlace de descarga directo y permanente:
      #   https://github.com/<owner>/<repo>/releases/latest/download/AU-RA-FP-<version>.apk
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          name: AU-RA FP y Dr Electrum FP ${{ needs.apk.outputs.version }}
          body: |
            APKs compilados por GitHub Actions desde `${{ github.sha }}`.

            **AU-RA FP** es la mesa de la junta. **Dr Electrum FP** es la estación minera. Son
            paquetes distintos, así que se pueden instalar las dos a la vez sin que una desinstale
            a la otra.

            Instalación: abrir el .apk en el teléfono y permitir «instalar apps desconocidas». Si
            había una versión de EAS, desinstalarla primero (firma distinta).
          # runtime-ultron.txt: la huella de la APK de AU-RA. El flujo de OTA la lee de aquí («latest»)
          # para no publicar actualizaciones que ninguna APK instalada puede usar.
          files: |
            apks/*.apk
            apks/runtime-*.txt
          make_latest: true
