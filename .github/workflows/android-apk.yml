name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**", "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Prebuild Android
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      # Release = JS empaquetado + Hermes. Firmado con la keystore debug del template
      # para instalar directo; para Play Store se cambia la firma.
      - name: Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/ULTRON-FP-${VERSION}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-FP-apk
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: 30
