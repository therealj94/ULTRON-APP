name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS
        working-directory: mobile
        run: npm install

      - name: Prebuild Android
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --non-interactive --no-install

      - name: Sign release with debug key
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # release must ship JS; debug signing so CI no pide keystore de Play
          python3 - << 'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          t = p.read_text() if p.exists() else Path("app/build.gradle.kts").read_text()
          print("gradle exists", p.exists() or Path("app/build.gradle.kts").exists())
          PY
          ls app | head

      - name: Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
