name: OTA (EAS Update)

# Actualizaciones por aire para las APK de main. Solo JS y assets: lo nativo va en una APK nueva
# (android-apk.yml), y la huella (runtimeVersion con política `fingerprint`) garantiza que una
# actualización solo la descarga una APK con EXACTAMENTE el mismo nativo.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ota.yml"
      - ".github/workflows/calidad-movil.yml"
  workflow_dispatch:
    inputs:
      accion:
        description: "publicar = subir el JS de este commit · volver-a-la-apk = que las APK olviden las OTA y usen su JS de fábrica"
        type: choice
        options: [publicar, volver-a-la-apk]
        default: publicar

# Nunca dos publicaciones a la vez en el mismo canal, y nunca cortar una a medias.
concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Las pruebas funcionales ANTES de publicar: una OTA no sale de un commit que rompe una prueba. La
  # marcha atrás de emergencia (`volver-a-la-apk`) no espera a las pruebas: no publica JS nuevo.
  calidad:
    if: github.ref == 'refs/heads/main' && inputs.accion != 'volver-a-la-apk'
    uses: ./.github/workflows/calidad-movil.yml

  ota:
    needs: calidad
    # Solo desde main: el canal `production` es el de las APK de main. Y solo con las pruebas en verde
    # (o para volver al JS de la APK, que no las necesita).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.calidad.result == 'success' || inputs.accion == 'volver-a-la-apk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El secreto EXPO_TOKEN va en los secretos del repositorio (Settings → Secrets → Actions). Quien
    # pueda empujar a main puede cambiar el JS de la app: el token se revoca si se filtra.
    # A nivel de trabajo, como en android-apk.yml: app.config.js se evalúa al calcular la huella y
    # al exportar el paquete, y con otra variante o canal saldría la huella (y el JS) de otra APK.
    env:
      ULTRON_APP: ${{ matrix.variante }}
      EXPO_CANAL: production
      EXPO_NO_TELEMETRY: "1"
    strategy:
      fail-fast: false
      matrix:
        # Cada app con su proyecto EAS en la cuenta ordenglobal (app.json / app.config.js).
        variante: ["ultron", "electrum"]
    steps:
      # Sin el token no se puede publicar: en main eso es un fallo (rojo), no un verde que no publicó
      # nada. Lo arregla quien tenga la cuenta de Expo poniendo el secreto.
      - name: ¿Hay EXPO_TOKEN?
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN (token de la cuenta dueña de los proyectos, ordenglobal): la OTA de este commit NO se publicó. https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Versión fija: con `latest`, un eas-cli nuevo puede romper la publicación sin que cambie nada
      # aquí. 24.8.0 es la que publicó bien las últimas OTA; se sube a mano.
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      # Solo lo que hace falta para publicar: el typecheck y las pruebas ya pasaron en `calidad`
      # (mismo commit), aquí no se repiten.
      - name: Install JS
        working-directory: mobile
        run: npm ci

      - name: Runtime (huella nativa) de este commit
        id: runtime
        working-directory: mobile
        run: echo "runtime=$(node ../scripts/qa/runtime-android.mjs)" >> "$GITHUB_OUTPUT"

      # ¿Hay una APK publicada que pueda recibir esto? La huella de la última APK de main está en
      # el Release «latest» (runtime-<variante>.txt, lo escribe android-apk.yml). Si no coincide,
      # el commit tocó algo nativo: la actualización no le llegaría a nadie y lo que toca es la APK
      # nueva que android-apk.yml ya está compilando para este mismo push.
      - name: ¿Lo puede recibir la APK publicada?
        id: apk
        if: inputs.accion != 'volver-a-la-apk'
        env:
          GH_TOKEN: ${{ github.token }}
          RT: ${{ steps.runtime.outputs.runtime }}
        run: |
          mkdir -p rt
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "runtime-${ULTRON_APP}.txt" --dir rt 2>/dev/null || true
          PUBLICADA=$(cat "rt/runtime-${ULTRON_APP}.txt" 2>/dev/null || echo "")
          if [ "$PUBLICADA" = "$RT" ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            echo "✓ ${ULTRON_APP}: misma huella que la APK publicada ($RT) → se publica OTA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            # Verde a propósito (no es un error), pero que se vea en el resumen de la ejecución.
            echo "::warning title=OTA no publicada en ${ULTRON_APP} por cambio nativo::Este commit cambia la huella nativa ($RT; APK publicada: ${PUBLICADA:-ninguna}). Las APK instaladas no pueden recibirlo por aire: hay que instalar la APK nueva que compila android-apk.yml."
            echo "✗ ${ULTRON_APP}: requiere APK nueva (huella $RT ≠ ${PUBLICADA:-ninguna})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar OTA
        if: inputs.accion != 'volver-a-la-apk' && steps.apk.outputs.compatible == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Por variable y no interpolado en el script: un mensaje de commit con comillas o `$(…)`
          # no debe poder ejecutar nada.
          MENSAJE: ${{ github.event.head_commit.message || 'publicación manual' }}
        run: |
          eas update \
            --channel production \
            --platform android \
            --message "$(printf '%s' "$MENSAJE" | head -n1 | cut -c1-200) (${GITHUB_SHA::7})" \
            --non-interactive

      # Marcha atrás de emergencia: las APK de esta huella dejan de usar cualquier OTA y vuelven al
      # JS con el que se compilaron. Para volver a una OTA anterior concreta: `eas update:republish`.
      - name: Volver al JS de la APK
        if: inputs.accion == 'volver-a-la-apk'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update:roll-back-to-embedded \
            --channel production \
            --platform android \
            --runtime-version "${{ steps.runtime.outputs.runtime }}" \
            --message "Vuelta al JS de la APK (${GITHUB_SHA::7})" \
            --non-interactive
