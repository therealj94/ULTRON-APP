name: Emulador Android (AU-RA FP)

# AU-RA FP de verdad en un emulador: la APK publicada en el Release «latest» (la que compila android-apk.yml) con la
# OTA de producción, entrando con una cuenta de PRUEBA y conversando por el chat de la mesa contra
# https://aura-fp.onrender.com. Deja evidencia: una captura por paso, la pantalla grabada (trozos de <3 min), el
# logcat de la app y el resultado de cada escenario en el resumen. Los flujos y el guion: mobile/pruebas/emulador/.
#
# Cuándo: a mano (workflow_dispatch) y después de cada OTA publicada con éxito desde main. Nunca en cada push.
#
# Dos veredictos (veredicto.mjs; hallazgo REL01: una corrida salió verde con la OTA sin cargar y cinco escenarios
# omitidos):
#   HUMO: instalar, abrir, llegar al formulario de entrada, sin cierres. Si falla, el trabajo va en rojo siempre.
#   ACEPTACIÓN DE LA OTA: la app corre la OTA esperada (updateId, runtime, canal; abrir → esperar → reabrir en ciclos)
#     Y los escenarios con cuenta pasan. OTA sin cargar o escenarios OMITIDO = INCONCLUSA; otra OTA = FALLA; nunca PASA.
#     Después de publicar una OTA (workflow_run) se exige: si no es PASA, el paso «Veredicto» va en rojo. A mano, se
#     exige si hay OTA esperada, salvo que se pida `solo_humo`; entonces el resumen dice «solo humo».
#
# La cuenta: los secretos AURA_PRUEBA_CORREO y AURA_PRUEBA_CLAVE (una cuenta DEDICADA, nivel miembro, sin WhatsApp ni
# correos conectados; cuenta-prueba.mjs lo comprueba antes: el nivel que le da el servidor, y que no esté en la lista de
# la junta del secreto AURA_CORREOS_JUNTA, que no vive en el repositorio). Sin ellos, o si la cuenta no es segura, la prueba solo
# instala y abre la app, y los escenarios que necesitan entrar salen como OMITIDO con el motivo en el resumen: el humo
# puede pasar, pero la aceptación de la OTA queda INCONCLUSA (y, después de una OTA, el trabajo en rojo).
#
# El repositorio es público y sus artefactos se pueden bajar: ni el correo ni la clave de prueba salen en la
# evidencia (sin capturas ni grabación durante la entrada; logcat y datos enmascarados).
on:
  workflow_dispatch:
    inputs:
      solo_humo:
        description: "Solo humo: no exigir la aceptación de la OTA (el resumen lo dice)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["OTA (EAS Update)"]
    types: [completed]
    branches: [main]

# Una sola a la vez: una nueva (otra OTA, otro clic) corta la que iba.
concurrency:
  group: emulador-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulador:
    # Después de una OTA, solo si salió bien.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EVIDENCIA: ${{ github.workspace }}/evidencia
      MAESTRO_VERSION: "2.11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Solo la prueba (la lista de la junta llega por el secreto AURA_CORREOS_JUNTA, no del repositorio).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mobile/pruebas/emulador/

      # Los runners de Linux tienen KVM, pero el dispositivo no es de todos: la regla de udev de siempre.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Maestro en versión fija (con «latest», un Maestro nuevo puede romper la prueba sin que cambie nada aquí).
      - name: Instalar Maestro
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: Sintaxis de los flujos
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DISABLE_UPDATE_CHECK: "1"
        run: |
          for f in mobile/pruebas/emulador/flujos/*.yaml; do
            printf '%s: ' "$f"
            maestro check-syntax "$f"
          done

      # La APK que publicó android-apk.yml en el Release «latest», la huella que trae y la ficha de la última OTA
      # (Release «aura-ota», la escribe ota.yml): con ellas se sabe qué updateId debería cargar la app.
      - name: Bajar la APK publicada
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          SOLO_HUMO: ${{ inputs.solo_humo }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cd "$RUNNER_TEMP/apk"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'AU-RA-FP-*.apk' --pattern 'runtime-ultron.txt'
          gh release download aura-ota --repo "$GITHUB_REPOSITORY" --pattern 'ota-aura.json' 2>/dev/null || echo "sin ficha de OTA"
          APK=$(ls AU-RA-FP-*.apk | head -n 1)
          RT=$(cat runtime-ultron.txt 2>/dev/null || echo "")
          OTA=""
          TIPO=""
          if [ -f ota-aura.json ] && [ -n "$RT" ]; then
            OTA=$(jq -r --arg rt "$RT" '[.publicaciones[]? | select(.plataforma == "ultron" and .canal == "production" and .runtimeVersion == $rt and .tipo == "ota")][0].androidUpdateId // ""' ota-aura.json)
            TIPO=$(jq -r --arg rt "$RT" '[.publicaciones[]? | select(.plataforma == "ultron" and .canal == "production" and .runtimeVersion == $rt)][0].tipo // ""' ota-aura.json 2>/dev/null || echo "")
          fi
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # Qué se exige: después de publicar una OTA, su aceptación; a mano, también si hay OTA esperada y no se
          # pidió solo humo.
          # Volver a la APK a propósito (ota.yml «volver-a-la-apk» deja la ficha en tipo «embebido»): no hay OTA que
          # aceptar, la app debe correr su JS embebido; solo humo. Una ficha que falta sigue en aceptación (rojo).
          MODO=aceptacion
          if [ "$TIPO" = "embebido" ] || { [ "$EVENTO" != "workflow_run" ] && { [ "$SOLO_HUMO" = "true" ] || [ -z "$OTA" ]; }; }; then MODO=humo; fi
          echo "apk=$RUNNER_TEMP/apk/$APK" >> "$GITHUB_OUTPUT"
          echo "ota=$OTA" >> "$GITHUB_OUTPUT"
          echo "runtime=$RT" >> "$GITHUB_OUTPUT"
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          {
            echo "## Emulador Android · AU-RA FP"
            echo ""
            echo "- APK: \`$APK\` (Release \`$TAG\`), runtime \`${RT:-?}\`"
            echo "- OTA de producción esperada para ese runtime: \`${OTA:-ninguna publicada}\`"
            if [ "$MODO" = humo ]; then
              echo "- Modo: **solo humo** (la aceptación de la OTA no se exige en esta corrida)"
            else
              echo "- Modo: **aceptación** de la OTA (se exige la OTA esperada cargada y los escenarios con cuenta en PASA)"
            fi
            echo "- Servidor: https://aura-fp.onrender.com"
          } >> "$GITHUB_STEP_SUMMARY"

      # La APK trae el nativo solo para ARM y sin extraer (extractNativeLibs="false"). En la imagen x86_64 el ARM se
      # traduce, pero así SoLoader no encuentra libreactnative.so y la app se cierra al abrir (primera ejecución,
      # 7-oct). Para el emulador se instala una COPIA con las .so extraídas, firmada con una llave desechable: el JS,
      # la huella (runtime) y por tanto la OTA son los mismos; la APK publicada no se toca.
      - name: Preparar la copia para el emulador x86_64
        id: copia
        env:
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)
          D="$RUNNER_TEMP/copia"
          mkdir -p "$D/m"
          unzip -p "$APK" AndroidManifest.xml > "$D/original.xml"
          ESTADO=$(node mobile/pruebas/emulador/extraer-nativas.mjs "$D/original.xml" "$D/m/AndroidManifest.xml")
          echo "extractNativeLibs: $ESTADO"
          cp "$APK" "$D/sin-firma.apk"
          (cd "$D/m" && zip -q "$D/sin-firma.apk" AndroidManifest.xml)
          # Fuera la firma vieja (v1); los demás META-INF (services, módulos de Kotlin) se quedan.
          zip -q -d "$D/sin-firma.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          "$BT/zipalign" -f -p 4 "$D/sin-firma.apk" "$D/alineada.apk"
          keytool -genkeypair -keystore "$D/desechable.jks" -storepass emulador -keypass emulador -alias emulador \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Emulador AU-RA (prueba)" > /dev/null 2>&1
          "$BT/apksigner" sign --ks "$D/desechable.jks" --ks-pass pass:emulador --ks-key-alias emulador \
            --out "$D/AU-RA-FP-emulador.apk" "$D/alineada.apk"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$D/AU-RA-FP-emulador.apk" | grep -i extractNativeLibs
          # El canal que pide la APK (expo-updates: la cabecera expo-channel-name del manifiesto). Si no es el de la
          # OTA, nunca la cargaría. Si no se puede leer, queda vacío y no decide nada.
          CANAL=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null \
            | grep -A3 'UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY' | sed -E 's/&quot;/"/g; s/\\"/"/g' \
            | grep -oE '"expo-channel-name" *: *"[^"]+"' | head -n 1 | sed -E 's/.*: *"([^"]+)"/\1/' || true)
          echo "Canal de la APK: ${CANAL:-?}"
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"
          echo "apk=$D/AU-RA-FP-emulador.apk" >> "$GITHUB_OUTPUT"
          echo "- Emulador: copia de la APK con \`extractNativeLibs=true\` y firma desechable (el ARM de la APK se traduce en x86_64)." >> "$GITHUB_STEP_SUMMARY"

      # Antes de tocar el emulador: ¿la cuenta de prueba es segura? (no es de la junta, nivel miembro, sin WhatsApp ni
      # correos conectados). Nunca imprime el correo ni la clave.
      - name: Comprobar la cuenta de prueba
        id: cuenta
        env:
          AURA_PRUEBA_CORREO: ${{ secrets.AURA_PRUEBA_CORREO }}
          AURA_PRUEBA_CLAVE: ${{ secrets.AURA_PRUEBA_CLAVE }}
          AURA_CORREOS_JUNTA: ${{ secrets.AURA_CORREOS_JUNTA }}
        run: |
          mkdir -p "$EVIDENCIA/datos"
          node mobile/pruebas/emulador/cuenta-prueba.mjs | tee "$EVIDENCIA/datos/cuenta.json"
          SEGURA=$(jq -r '.segura' "$EVIDENCIA/datos/cuenta.json")
          MOTIVO=$(jq -r '.motivo' "$EVIDENCIA/datos/cuenta.json")
          if [ "$SEGURA" = "true" ]; then
            echo "- Cuenta de prueba: ✓ $MOTIVO" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Escenarios con cuenta omitidos::$MOTIVO"
            echo "- Cuenta de prueba: ✗ $MOTIVO Los escenarios que necesitan entrar se omiten." >> "$GITHUB_STEP_SUMMARY"
          fi

      # API 34 x86_64 con Google APIs, perfil Pixel. La APK trae nativo ARM (arm64-v8a/armeabi-v7a): la imagen x86_64
      # lo traduce. Cámara trasera = la escena virtual del emulador; la delantera, la emulada.
      - name: Emulador y escenarios
        id: escenarios
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_AURA: ${{ steps.copia.outputs.apk }}
          OTA_ESPERADA: ${{ steps.apk.outputs.ota }}
          RUNTIME_ESPERADO: ${{ steps.apk.outputs.runtime }}
          CANAL_APK: ${{ steps.copia.outputs.canal }}
          CUENTA_SEGURA: ${{ steps.cuenta.outputs.segura }}
          CUENTA_MOTIVO: ${{ steps.cuenta.outputs.motivo }}
          AURA_PRUEBA_CORREO: ${{ steps.cuenta.outputs.segura == 'true' && secrets.AURA_PRUEBA_CORREO || '' }}
          AURA_PRUEBA_CLAVE: ${{ steps.cuenta.outputs.segura == 'true' && secrets.AURA_PRUEBA_CLAVE || '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front emulated
          disable-animations: true
          emulator-boot-timeout: 600
          # Una sola línea: la acción corre cada línea de `script` por separado.
          script: bash mobile/pruebas/emulador/correr.sh

      # Humo y aceptación de la OTA por separado (veredicto.mjs), las dos fuentes de JS y cada escenario.
      - name: Resumen
        if: always()
        env:
          MODO: ${{ steps.apk.outputs.modo }}
          OTA_ESPERADA: ${{ steps.apk.outputs.ota }}
          RUNTIME_ESPERADO: ${{ steps.apk.outputs.runtime }}
          CANAL_APK: ${{ steps.copia.outputs.canal }}
        run: |
          node mobile/pruebas/emulador/veredicto.mjs "$EVIDENCIA/resultados.tsv" "$EVIDENCIA/datos/ota.json" --markdown >> "$GITHUB_STEP_SUMMARY"
          node mobile/pruebas/emulador/veredicto.mjs "$EVIDENCIA/resultados.tsv" "$EVIDENCIA/datos/ota.json" > "$EVIDENCIA/datos/veredicto.json" || true
          {
            echo ""
            N_CAP=$(ls "$EVIDENCIA/capturas" 2>/dev/null | wc -l)
            N_VID=$(ls "$EVIDENCIA/video" 2>/dev/null | wc -l)
            echo "Evidencia (artefacto \`emulador-evidencia\`): $N_CAP capturas, $N_VID trozo(s) de video, \`logcat-app.txt\` y \`datos/\` (\`ota.json\`, \`veredicto.json\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir la evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-evidencia
          path: ${{ env.EVIDENCIA }}
          if-no-files-found: warn
          retention-days: 14

      # Rojo si el humo falla (siempre) o si, en modo aceptación, la OTA no queda aceptada: OTA sin cargar, otra OTA,
      # escenarios OMITIDO (sin cuenta de prueba) o un escenario en FALLA. En modo «solo humo», verde con aviso.
      - name: Veredicto
        if: always()
        env:
          MODO: ${{ steps.apk.outputs.modo }}
          OTA_ESPERADA: ${{ steps.apk.outputs.ota }}
          RUNTIME_ESPERADO: ${{ steps.apk.outputs.runtime }}
          CANAL_APK: ${{ steps.copia.outputs.canal }}
        run: node mobile/pruebas/emulador/veredicto.mjs "$EVIDENCIA/resultados.tsv" "$EVIDENCIA/datos/ota.json" --salir
